<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#172B42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PIBEX">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>PIBEX 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Serif+4:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>

/* Layout: a "Boletín Oficial" for a made-up Patagonian bureaucracy — masthead + sticky tab rail + one column of official sheets. */
:root{
  --paper:#E9EEE9; --sheet:#F7FAF6; --ink:#17212A; --muted:#58666E; --line:#C5CFC9;
  --lake:#1D5878; --pine:#2D5A47; --stamp:#B2352A; --gold:#9A7623;
  --lake-soft:#D7E5EC; --pine-soft:#D8E6DD; --stamp-soft:#F3DCD8; --gold-soft:#EFE5CC;
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E151A; --sheet:#152029; --ink:#E3EAE6; --muted:#93A2A9; --line:#2A3943;
  --lake:#78B6D6; --pine:#86C1A3; --stamp:#EA7466; --gold:#DDB662;
  --lake-soft:#1A3342; --pine-soft:#1A3328; --stamp-soft:#3D1F1C; --gold-soft:#3A3020; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E151A; --sheet:#152029; --ink:#E3EAE6; --muted:#93A2A9; --line:#2A3943;
  --lake:#78B6D6; --pine:#86C1A3; --stamp:#EA7466; --gold:#DDB662;
  --lake-soft:#1A3342; --pine-soft:#1A3328; --stamp-soft:#3D1F1C; --gold-soft:#3A3020; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:860px;margin:0 auto}
a{color:var(--lake)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
h2{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:700}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px}

/* Masthead */
.mast{position:relative;padding-block:28px 18px;border-bottom:3px double var(--ink);display:grid;gap:6px}
.mast-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.mast h1{font-size:clamp(3rem,13vw,6.2rem);font-weight:800;letter-spacing:-.02em;line-height:.9}
.mast h1 em{font-style:italic;font-weight:500;color:var(--lake)}
.mast .sub{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap}
.stamp{position:absolute;right:4px;top:54px;width:118px;height:118px;border:3px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;text-align:center;transform:rotate(-14deg);font-family:var(--f-mono);font-size:.58rem;letter-spacing:.12em;line-height:1.25;text-transform:uppercase;opacity:.85;pointer-events:none}
.stamp::before{content:"";position:absolute;inset:5px;border:1px solid var(--stamp);border-radius:50%}
.stamp b{display:block;font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em}
@media (max-width:560px){.stamp{width:80px;height:80px;top:auto;bottom:34px;right:0;font-size:.42rem}.stamp b{font-size:.78rem}}
.ridge{display:block;width:100%;height:28px;color:var(--pine);margin-top:4px}
.me-chip{display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.iconbtn:hover{border-color:var(--ink)}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.tabs-in{max-width:860px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:12px 11px 10px;cursor:pointer;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--stamp)}
.tab:hover{color:var(--ink)}

main{padding-top:26px;display:grid;gap:22px}
.head{display:grid;gap:6px}
.head p{color:var(--muted);max-width:62ch}

/* Sheets */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.sheet.official{border-top:4px solid var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:10px}

/* Countdown */
.count{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.count .n{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,12vw,4.6rem);line-height:.9;font-variant-numeric:lining-nums tabular-nums}
.count .u{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Forms */
.field{display:grid;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=time],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:9px 10px}
textarea{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--lake);border-color:var(--lake)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--paper)}
.btn.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.sm{padding:5px 10px;font-size:.8rem;font-weight:500}
.link{border:0;background:none;padding:0;color:var(--lake);cursor:pointer;font-size:.85rem;text-decoration:underline;text-underline-offset:2px}
.link.danger{color:var(--stamp)}
.sheet>.link,.sheet>.btn,.sheet>.iconbtn{justify-self:start}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.ok{background:var(--pine-soft);color:var(--pine)}
.warn{background:var(--gold-soft);color:var(--gold)}
.bad{background:var(--stamp-soft);color:var(--stamp)}
.info{background:var(--lake-soft);color:var(--lake)}

/* Official document */
.doc{display:grid;gap:12px}
.doc .num{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.14em;color:var(--stamp);text-transform:uppercase}
.doc h3{font-size:1.6rem}
.doc .body{display:grid;gap:10px;max-width:65ch}
.doc .body h4{font-family:var(--f-display);font-size:1.1rem;margin-top:6px}
.doc .body ul{margin:0;padding-left:20px;display:grid;gap:2px}
.doc .sign{font-family:var(--f-display);font-style:italic;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* Comments */
.thread{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.cmt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.cmt .who{font-weight:600;font-size:.85rem}
.cmt .txt{font-size:.92rem;overflow-wrap:anywhere}
.av{width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:.95rem;line-height:1}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0}

/* Posts */
.post .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.post .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1rem}

/* Schedule */
.day{display:grid;gap:10px}
.dayhead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:4px}
.dayhead h3{font-size:1.5rem}
.ev{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.ev .t{font-family:var(--f-mono);font-weight:600;font-size:.95rem;color:var(--lake)}
.ev.fixed{background:transparent;border-style:dashed}
.ev .ttl{font-weight:600}
.ev .body{display:grid;gap:6px;min-width:0}

/* Tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--paper)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.me td{background:var(--lake-soft)}

/* Progress */
.bar{height:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pine)}
.big{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:lining-nums tabular-nums}

/* Arrivals */
.arr{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.arr:last-child{border-bottom:0}
.arr .t{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1}
.names{display:flex;flex-wrap:wrap;gap:6px}
.name{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:4px;overflow:hidden;background:var(--line);border:0;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:.75rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left}
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,10,14,.92);display:grid;place-items:center;padding:20px;color:#fff}
.lb figure{margin:0;display:grid;gap:10px;max-width:min(1000px,100%)}
.lb img{max-height:78vh;width:auto;margin:0 auto;border-radius:4px}
.lb figcaption{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}
.lb .link{color:#cfe6f2}
.lb .link.danger{color:#ff9d91}

/* Awards */
.aw{display:grid;gap:8px}
.aw h3{font-size:1.15rem}
.res{display:grid;gap:4px}
.res .r{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:.85rem}
.res .r i{display:block;height:8px;background:var(--gold);border-radius:999px}

/* Places */
.places{display:grid;gap:0}
.pl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pl:last-child{border-bottom:0}
.pl .n{font-weight:600}
.pl .d{font-size:.85rem;color:var(--muted)}
.pl a{flex:none;font-family:var(--f-mono);font-size:.75rem}

/* Checklist */
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;accent-color:var(--pine)}
.chk.done .t{text-decoration:line-through;color:var(--muted)}
.chk .t{flex:1;min-width:0;overflow-wrap:anywhere}

/* Committees */
.com{border-left:4px solid var(--ink);display:grid;gap:8px}
.com.vac{border-left-color:var(--line);border-left-style:dashed}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,20,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal .sheet{max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.emojis .chipbtn{font-size:1.15rem;padding:3px 9px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:999px;z-index:70;font-size:.9rem;max-width:calc(100% - 32px)}
.banner{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;font-size:.85rem}
.newpill{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30}
.copybox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copybox code{font-family:var(--f-mono);background:var(--paper);border:1px solid var(--line);padding:4px 8px;border-radius:4px;user-select:all;overflow-wrap:anywhere}
.feed{display:grid;gap:0}
.feed .it{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;font-size:.9rem}
.feed .it:last-child{border-bottom:0}
.empty{color:var(--muted);font-style:italic;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){ main>*{animation:rise .35s ease both} @keyframes rise{from{transform:translateY(6px)}to{transform:none}} }

/* ---- v2 ---- */
.tabs{position:sticky}
.tabs-box{position:relative;max-width:860px;margin:0 auto}
.tabs-in{padding-inline:28px}
.tabarrow{position:absolute;top:0;bottom:1px;width:34px;border:0;cursor:pointer;color:var(--ink);font-size:1.3rem;line-height:1;display:grid;place-items:center;z-index:2;padding:0}
.tabarrow.l{left:-6px;background:linear-gradient(90deg,var(--paper) 55%,transparent)}
.tabarrow.r{right:-6px;background:linear-gradient(270deg,var(--paper) 55%,transparent)}
.tabarrow:disabled{opacity:.18;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;align-content:start;text-align:left;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile .big{font-size:1.9rem}
.tile .lbl{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .sub{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.wx{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px}
.wx div{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px;text-align:center;display:grid;gap:2px;font-size:.8rem}
.wx b{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.wx .e{font-size:1.3rem;line-height:1.1}
.wx .tmp{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sealed{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sealed div{height:86px;border-radius:var(--r);border:1px dashed var(--line);background:repeating-linear-gradient(135deg,var(--sheet),var(--sheet) 8px,var(--paper) 8px,var(--paper) 16px);display:grid;place-items:center;font-family:var(--f-display);font-size:2rem;color:var(--muted)}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.room{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.room.mine{border:2px solid var(--stamp)}
.room h3{font-size:1.2rem}
.room .names .name.hid{visibility:hidden}
.room .names .name.me{background:var(--stamp-soft);border-color:var(--stamp);color:var(--stamp)}
.ph .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:2rem;text-shadow:0 2px 8px rgba(0,0,0,.6);background:none;padding:0}
.ph video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph .lk{position:absolute;top:6px;right:6px;left:auto;bottom:auto;background:rgba(0,0,0,.55);border-radius:999px;padding:1px 7px;font-size:.72rem}
.lb video{max-height:74vh;max-width:100%;margin:0 auto;border-radius:4px;background:#000}
.lb .acts{display:flex;gap:8px;flex-wrap:wrap}
.lb .btn{background:#fff;color:#111;border-color:#fff}
.lb .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.pin{font-family:var(--f-mono);letter-spacing:.5em;font-size:1.3rem;text-align:center;max-width:180px}
.chipbtn:disabled{opacity:.3;cursor:not-allowed}
.chipbtn .lock{font-size:.7rem;margin-left:4px;opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fact{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:3px}
.fact .lbl{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact b{font-family:var(--f-display);font-size:1.15rem}
.org{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.org>.eyebrow{color:var(--gold)}
.catedit{display:flex;gap:6px;align-items:center}
.catedit input{flex:1;min-width:0}
.thumb{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:4px;display:block;background:var(--line)}
.tab{position:relative}
.tab .dot{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:5px;border-radius:999px;background:var(--stamp);color:#fff;font-size:.62rem;letter-spacing:0;vertical-align:1px}
.likebar{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.likebtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.82rem;line-height:1.5}
.likebtn.on{border-color:var(--stamp);background:var(--stamp-soft)}
.likebtn b{font-family:var(--f-mono);font-weight:600}
.wxnow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.wxnow>.e{font-size:2.6rem;line-height:1}
@media (max-width:480px){.wxnow{grid-template-columns:auto 1fr}.wxnow .btn{grid-column:1/-1;justify-self:start}}
.wxscroll{overflow-x:auto;margin-inline:-4px;padding:4px}
.wxscroll .wx{display:grid;grid-auto-flow:column;grid-auto-columns:84px;grid-template-columns:none}
.wx div.trip{border:2px solid var(--gold);background:var(--gold-soft)}

/* ---- Identidad oficial PIBEX 2026: azul marino + crema del escudo, ámbar cervecero como acento ---- */
:root{
  --brand:#172B42; --brand-2:#22395A; --cream:#FBF5E4; --cream-dim:rgba(251,245,228,.68);
  --paper:#F3EDDD; --sheet:#FFFBF1; --ink:#172B42; --muted:#5D6878; --line:#DCD3BE;
  --lake:#2B5C8C; --pine:#2F6B4F; --stamp:#B8402F; --gold:#B47B1E;
  --lake-soft:#DFE7F0; --pine-soft:#DCEADF; --stamp-soft:#F6DED7; --gold-soft:#F5E6C6;
  --f-display:"Montserrat", "Gotham", "Avenir Next", system-ui, sans-serif;
  --f-verse:"Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1C2C; --sheet:#172B42; --ink:#FBF5E4; --muted:#A6B0BE; --line:#2A4262;
  --lake:#9CC3E8; --pine:#8CCBA8; --stamp:#F08A78; --gold:#E9B65C;
  --lake-soft:#1F3A58; --pine-soft:#1C3A30; --stamp-soft:#432826; --gold-soft:#3B3220; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1C2C; --sheet:#172B42; --ink:#FBF5E4; --muted:#A6B0BE; --line:#2A4262;
  --lake:#9CC3E8; --pine:#8CCBA8; --stamp:#F08A78; --gold:#E9B65C;
  --lake-soft:#1F3A58; --pine-soft:#1C3A30; --stamp-soft:#432826; --gold-soft:#3B3220; color-scheme:dark }

h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.01em}
h2{font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(1.5rem,4.2vw,2rem)}
h3{font-weight:700}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.68rem;letter-spacing:.16em}
.big,.count .n,.arr .t{font-family:var(--f-display);font-weight:800}

/* Banda institucional */
.mast{background:var(--brand);color:var(--cream);margin-inline:-16px;padding:22px 16px 18px;border-bottom:0;display:block;position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;right:-90px;bottom:-140px;width:360px;height:360px;background:url(logo.png) center/contain no-repeat;opacity:.06;pointer-events:none}
.mast-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:'logo txt tools' 'logo verse tools';column-gap:22px;row-gap:8px;align-items:center;position:relative;z-index:1}
.mast .logo{grid-area:logo}.mast-txt{grid-area:txt;align-self:end}.verse{grid-area:verse;align-self:start}
.mast .logo{width:128px;height:128px;border-radius:50%;box-shadow:0 0 0 3px var(--brand),0 0 0 4px rgba(251,245,228,.25)}
.mast-txt{display:grid;gap:6px;min-width:0}
.mast .eyebrow{color:var(--cream-dim)}
.mast h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7vw,3.4rem);letter-spacing:.04em;line-height:1;color:var(--cream)}
.mast h1 span{display:block;font-size:.42em;letter-spacing:.32em;font-weight:700;margin-top:6px;color:var(--cream-dim)}
.verse{font-family:var(--f-verse);font-style:italic;font-size:1rem;line-height:1.5;color:var(--cream);opacity:.9;max-width:44ch}
.mast-tools{grid-area:tools;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-self:start}
.mast .iconbtn{background:transparent;color:var(--cream);border-color:rgba(251,245,228,.35)}
.mast .iconbtn:hover{border-color:var(--cream);background:var(--brand-2)}
@media (max-width:560px){
  .mast-in{grid-template-columns:84px 1fr;grid-template-areas:'logo txt' 'verse verse' 'tools tools';column-gap:12px;row-gap:10px}
  .mast .logo{width:84px;height:84px}
  .verse{font-size:.86rem}
  .mast-tools{justify-content:flex-start}
}

/* Menú sobre la banda */
.tabs{background:var(--brand);border-bottom:0;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.tab{color:var(--cream-dim);font-family:var(--f-display);font-weight:700;font-size:.72rem;letter-spacing:.12em}
.tab:hover{color:var(--cream)}
.tab[aria-current="page"]{color:var(--cream);border-bottom-color:#E9B65C}
.tabarrow{color:var(--cream)}
.tabarrow.l{background:linear-gradient(90deg,var(--brand) 55%,transparent)}
.tabarrow.r{background:linear-gradient(270deg,var(--brand) 55%,transparent)}
.tab .dot{background:#E9B65C;color:var(--brand)}

.sheet.official{border-top:4px solid var(--brand)}

`Estimados miembros del grupo:

Por medio del presente, la Comisión Organizativa Creativa Barilochense comunica la apertura oficial del PROGRAMA DE LAS SORPRESAS.

## 1. ¿De qué se trata?
En la misma línea de lo vivido en el viaje 2015 (quienes estuvieron presentes sabrán de qué hablamos), se invita a cada integrante a ofrendarle algo al grupo. Puede ser colaborar con una sorpresa, hacer felices a nuestros amigos o aportar algo que alegre algún momento de Bariloche.

## 2. Condiciones
Esta propuesta es sin condiciones. Cada uno puede hacerlo cuando quiera, en el momento que quiera y, en principio, sin avisarle a nadie.
Única excepción: si la sorpresa requiere más organización (reservar algo, apartar un horario o un momento puntual del viaje), se solicita informarlo previamente a la Comisión para garantizar que se pueda llevar a cabo.

## 3. Tipo de sorpresa
Cualquiera. La imaginación es el único límite. A modo de ejemplo:
- Algo material o inmaterial
- Algo físico o abstracto
- Un juego
- Una muletilla
- Bijouterie
- Una idea
- Un objetivo para cumplir durante el viaje

Puede organizarse de manera individual o grupal. No se mide por lo que cuesta, sino por lo que genera.

## 4. Convocatoria
Se anima, se empuja y se espera que todos participen de esta iniciativa, por el bien, la sanidad y la comunidad del viaje.

Sin otro particular, saludamos a ustedes muy atentamente.`}

/* ---- Truco ---- */
function trucoStats(){
  const ind={}, par={}; const ms=of("truco");
  const bump=(o,k,won,pf,pc)=>{o[k]=o[k]||{k,pj:0,pg:0,pp:0,pf:0,pc:0,seq:[]};const r=o[k];r.pj++;won?r.pg++:r.pp++;r.pf+=pf;r.pc+=pc;r.seq.push(won)};
  ms.forEach(m=>{const d=m.data;const w1=d.s1>d.s2;
    bump(par,[...d.p1].sort().join(" & "),w1,d.s1,d.s2); bump(par,[...d.p2].sort().join(" & "),!w1,d.s2,d.s1);
    d.p1.forEach(p=>bump(ind,p,w1,d.s1,d.s2)); d.p2.forEach(p=>bump(ind,p,!w1,d.s2,d.s1));});
  const sort=a=>Object.values(a).sort((x,y)=>y.pg-x.pg||(y.pf-y.pc)-(x.pf-x.pc)||y.pf-x.pf);
  const streak=seq=>{let best=0,c=0;seq.forEach(w=>{c=w?c+1:0;best=Math.max(best,c)});let cur=0;for(let i=seq.length-1;i>=0&&seq[i];i--)cur++;return {best,cur}};
  Object.values(ind).concat(Object.values(par)).forEach(r=>{const s=streak(r.seq);r.best=s.best;r.cur=s.cur});
  return {ind:sort(ind),par:sort(par),ms};
}

  <form class="sheet" data-form="event"><span class="eyebrow">Proponer un plan</span>
    <div class="fgrid">
      <div class="field"><label for="ev-d">Día</label><select id="ev-d" name="day">${DAYS.map(d=>`<option value="${d[0]}">${d[1]}</option>`).join("")}</select></div>
      <div class="field"><label for="ev-h">Hora</label><input type="time" id="ev-h" name="time"></div></div>
    <div class="field"><label for="ev-t">Qué</label><input type="text" id="ev-t" name="title" required placeholder="Ej: Catamarán a Isla Victoria"></div>
    <div class="field"><label for="ev-x">Detalle</label><input type="text" id="ev-x" name="desc" placeholder="Precio, punto de encuentro, qué llevar"></div>
    <div><button class="btn">${org?"Agregar al programa":"Enviar propuesta"}</button></div></form>
  ${pend.length?`<section class="org"><span class="eyebrow">Propuestas en revisión · ${pend.length}</span>${pend.map(evHTML).join("")}</section>`:""}

truco(){
  const {ind,par,ms}=trucoStats();
  const tbl=(rows,label)=>`<div class="tscroll"><table><thead><tr><th>#</th><th>${label}</th><th class="num">PJ</th><th class="num">PG</th><th class="num">PP</th><th class="num">% Vic</th><th class="num">Pts</th><th class="num">Dif</th><th class="num">Racha</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${ME&&r.k.split(" & ").includes(ME.name)?"me":""}"><td class="num">${i+1}</td><td>${esc(r.k)}</td><td class="num">${r.pj}</td><td class="num">${r.pg}</td><td class="num">${r.pp}</td><td class="num">${pct(r.pg,r.pj)}%</td><td class="num">${r.pf}</td><td class="num">${r.pf-r.pc>0?"+":""}${r.pf-r.pc}</td><td class="num">${r.cur?r.cur+"G":"–"}</td></tr>`).join("")}</tbody></table></div>`;
  let facts="";
  if(ms.length){
    const diff=m=>Math.abs(m.data.s1-m.data.s2); const desc=m=>{const d=m.data;const w=d.s1>d.s2;return `${(w?d.p1:d.p2).join(" & ")} ${Math.max(d.s1,d.s2)}–${Math.min(d.s1,d.s2)} a ${(w?d.p2:d.p1).join(" & ")}`};
    const paliza=ms.slice().sort((a,b)=>diff(b)-diff(a))[0]; const parejo=ms.slice().sort((a,b)=>diff(a)-diff(b))[0];
    const by=(arr,f)=>arr.slice().sort((a,b)=>f(b)-f(a))[0];
    const goleador=by(ind,r=>r.pf), vicio=by(ind,r=>r.pj), racha=by(ind,r=>r.best), castigado=by(ind,r=>r.pp);
    const efic=ind.filter(r=>r.pj>=3).sort((a,b)=>b.pg/b.pj-a.pg/a.pj)[0];
    const repetida=by(par,r=>r.pj);
    const f=(l,v,s)=>`<div class="fact"><span class="lbl">${l}</span><b>${esc(v)}</b><span class="small muted">${esc(s)}</span></div>`;
    facts=`<section class="stack"><h3>Estadísticas del campeonato</h3><div class="facts">
      ${f("Máxima paliza",paliza.data.p1.concat(paliza.data.p2).length?desc(paliza):"",`Diferencia de ${diff(paliza)} puntos`)}
      ${ms.length>1?f("El más parejo",desc(parejo),`Se definió por ${diff(parejo)}`):""}
      ${f("Más puntos a favor",goleador.k,goleador.pf+" puntos en "+goleador.pj+" partidos")}
      ${f("Mejor racha",racha.k,racha.best+" ganados seguidos")}
      ${efic?f("Más efectivo (3+ PJ)",efic.k,pct(efic.pg,efic.pj)+"% de victorias"):""}
      ${f("Vicioso del naipe",vicio.k,vicio.pj+" partidos jugados")}
      ${castigado.pp?f("El más castigado",castigado.k,castigado.pp+" derrotas"):""}
      ${f("Pareja más repetida",repetida.k,repetida.pj+" partidos juntos")}
      ${f("Puntos totales en juego",String(ms.reduce((s,m)=>s+m.data.s1+m.data.s2,0)),ms.length+" partidos")}
    </div></section>`;
  }
  return `<div class="head"><span class="eyebrow">Campeonato Patagónico de Truco</span><h2>Truco</h2><p>Partidos a 30 en parejas que se arman como quieran. Ranking por partidos ganados; desempata la diferencia de puntos.</p></div>
  <form class="sheet" data-form="truco"><span class="eyebrow">Cargar partido</span>
    <div class="grid2">
      <div class="stack"><b>Pareja 1</b><div class="fgrid"><select id="t-a1" name="a1" aria-label="Pareja 1, jugador 1">${personOpts()}</select><select id="t-a2" name="a2" aria-label="Pareja 1, jugador 2">${personOpts()}</select></div>
        <div class="field"><label for="t-s1">Puntos</label><input type="number" id="t-s1" name="s1" min="0" max="40" required></div></div>
      <div class="stack"><b>Pareja 2</b><div class="fgrid"><select id="t-b1" name="b1" aria-label="Pareja 2, jugador 1">${personOpts()}</select><select id="t-b2" name="b2" aria-label="Pareja 2, jugador 2">${personOpts()}</select></div>
        <div class="field"><label for="t-s2">Puntos</label><input type="number" id="t-s2" name="s2" min="0" max="40" required></div></div>
    </div><div><button class="btn">Cargar resultado</button></div></form>
  <section class="stack"><h3>Ranking de parejas</h3>${par.length?tbl(par,"Pareja"):`<p class="empty">Sin partidos todavía.</p>`}</section>
  <section class="stack"><h3>Ranking individual</h3>${ind.length?tbl(ind,"Jugador"):`<p class="empty">Sin partidos todavía.</p>`}</section>
  ${facts}
  ${ms.length?`<section class="sheet"><span class="eyebrow">Historial</span>${ms.slice().reverse().map(m=>{const d=m.data;const w=d.s1>d.s2;return `<div class="row between small"><span><b style="${w?"":"font-weight:400"}">${esc(d.p1.join(" & "))}</b> <span class="mono">${d.s1}–${d.s2}</span> <b style="${w?"font-weight:400":""}">${esc(d.p2.join(" & "))}</b></span><span class="muted">${ago(m.created_at)} · ${esc(m.author)} ${delBtn(m)}</span></div>`}).join("")}</section>`:""}`;
},

awards(){
  const cfg=awardsCfg(); const org=ME&&isOrg(ME.name); const voters=new Set(of("vote").map(v=>v.author)).size;
  const head=`<div class="head"><span class="eyebrow">Ceremonia de cierre · viernes 30 a la noche</span><h2>PIBEX Choice Awards</h2></div>`;
  const panel = org?`<section class="org"><span class="eyebrow">Panel de la organización · solo lo ven ustedes 6</span>
    ${cfg.phase==="hidden"?`<p class="small">Las categorías están ocultas para el resto. Editen, borren o sumen, y cuando estén conformes habiliten la votación.</p>
      ${cfg.cats.map(c=>`<div class="catedit"><input type="text" id="cat-${c.id}" data-cat="${c.id}" value="${esc(c.title)}" aria-label="Categoría"><button class="link danger" data-act="catdel" data-id="${c.id}">quitar</button></div>`).join("")}
      <div class="catedit"><input type="text" id="cat-new" placeholder="Nueva categoría" aria-label="Nueva categoría"><button class="btn sm" data-act="catadd">Sumar</button></div>
      <div class="row"><button class="btn ghost sm" data-act="catsave">Guardar cambios</button>${armBtn("aw-open","Habilitar votación para todos","Confirmar: habilitar votación","aw-open")}</div>`
    :cfg.phase==="voting"?`<p class="small">Votación abierta. ${voters} de ${PEOPLE.length} votaron.</p><div class="row">${armBtn("aw-reveal","Revelar resultados","Confirmar: revelar a todos","aw-reveal")}<button class="btn ghost sm" data-act="aw-hide">Volver a ocultar</button></div>`
    :`<div class="row"><button class="btn ghost sm" data-act="aw-reopen">Volver a votación</button></div>`}
  </section>`:"";
  if(cfg.phase==="hidden") return head+panel+`<section class="sheet official"><span class="eyebrow">Sobre lacrado</span><h3>${cfg.cats.length} categorías en deliberación</h3><p class="muted">La organización está definiendo las ternas. Cuando las habilite, te llega el aviso y podés votar.</p><div class="sealed">${cfg.cats.map(()=>`<div>?</div>`).join("")}</div></section>`;
  const rev=cfg.phase==="revealed";
  return head+panel+`<section class="sheet"><div class="row between"><span><span class="big">${voters}</span> <span class="muted">de ${PEOPLE.length} ya votaron</span></span><span class="pill ${rev?"ok":"info"}">${rev?"Resultados revelados":"Voto secreto hasta la ceremonia"}</span></div>${rev?"":`<p class="small muted">Votá una vez por categoría. Podés cambiar el voto hasta la revelación.</p>`}</section>
  <div class="grid2">${cfg.cats.map(c=>{const mv=myVote(c.id);const t=tally(c.id);const max=t[0]?t[0][1]:1;
    return `<section class="sheet aw"><h3>${esc(c.title)}</h3>${rev?`<div class="res">${t.length?t.slice(0,3).map(([n,v],i)=>`<div class="r"><span>${i===0?"🏆 ":""}${esc(n)}</span><i style="width:${v/max*100}%"></i><span class="mono">${v}</span></div>`).join(""):`<p class="empty">Sin votos.</p>`}</div>`
      :`<select data-vote="${esc(c.id)}" id="v-${esc(c.id)}" aria-label="Tu voto: ${esc(c.title)}">${personOpts(mv?mv.data.nominee:"","Tu voto…")}</select>`}</section>`}).join("")}</div>`;
},

cuartos(){
  const cfg=roomsCfg(); const org=ME&&isOrg(ME.name); const cap=cfg.rooms.reduce((s,r)=>s+Number(r.cap||0),0);
  const drawn=!!cfg.drawnAt; const sinCuarto=drawn?PEOPLE.filter(p=>!cfg.assign[p]):[];
  const panel=org?`<section class="org"><span class="eyebrow">Panel de la organización</span>
    ${cfg.rooms.length?cfg.rooms.map(r=>`<div class="row between small"><span><b>${esc(r.name)}</b> · ${r.cap} camas</span><button class="link danger" data-act="roomdel" data-id="${r.id}">quitar</button></div>`).join(""):`<p class="small">Carguen los cuartos de la mansión con sus camas.</p>`}
    <form class="fgrid" data-form="room"><input type="text" id="rm-n" name="name" placeholder="Nombre (ej: Suite del lago)" required aria-label="Nombre del cuarto"><input type="number" id="rm-c" name="cap" min="1" max="12" placeholder="Camas" required aria-label="Camas"><button class="btn sm">Agregar cuarto</button></form>
    <p class="small ${cap<PEOPLE.length?"":"muted"}">Camas cargadas: <b>${cap}</b> para ${PEOPLE.length} personas.${cap<PEOPLE.length&&cfg.rooms.length?" Los que sobren quedan en el living.":""}</p>
    ${cfg.rooms.length?`<div class="row">${armBtn("rm-draw",drawn?"Volver a sortear":"Hacer el sorteo",drawn?"Confirmar: se pierde el sorteo actual":"Confirmar sorteo","rm-draw")}</div>`:""}
    ${drawn?`<form class="fgrid" data-form="swap"><select id="sw-a" name="a" aria-label="Persona 1">${personOpts("","Intercambiar a…")}</select><select id="sw-b" name="b" aria-label="Persona 2">${personOpts("","…con")}</select><button class="btn ghost sm">Intercambiar</button></form>`:""}
  </section>`:"";
  return `<div class="head"><span class="eyebrow">Distribución habitacional · por sorteo</span><h2>Cuartos</h2><p>Dónde duerme cada uno. Lo sortea la organización y es inapelable (salvo coima en fernet).</p></div>
  ${panel}
  ${!drawn?`<section class="sheet official"><span class="eyebrow">Estado</span><h3>Sorteo pendiente</h3><p class="muted">${cfg.rooms.length?`Hay ${cfg.rooms.length} cuartos cargados. La organización avisa cuando se sortea.`:"Todavía no está definido cómo es la mansión por dentro."}</p></section>`
  :`<section class="sheet"><div class="row between"><span class="small muted">Sorteado ${ago(cfg.drawnAt)} por ${esc(cfg.drawnBy||"la organización")}</span><button class="btn ghost sm" data-act="replay">▶ Revivir el sorteo</button></div></section>
   <div class="rooms" id="rooms">${cfg.rooms.map(r=>{const ps=PEOPLE.filter(p=>cfg.assign[p]===r.id);const mine=ME&&ps.includes(ME.name);
     return `<section class="room ${mine?"mine":""}"><span class="eyebrow">${ps.length}/${r.cap} camas${mine?" · tu cuarto":""}</span><h3>${esc(r.name)}</h3><div class="names">${ps.map(p=>`<span class="name ${ME&&p===ME.name?"me":""}" data-p="${esc(p)}">${esc(emojiOf(p))} ${esc(p)}</span>`).join("")}</div></section>`}).join("")}
     ${sinCuarto.length?`<section class="room"><span class="eyebrow">Sin cama asignada</span><h3>Living</h3><div class="names">${sinCuarto.map(p=>`<span class="name ${ME&&p===ME.name?"me":""}" data-p="${esc(p)}">${esc(p)}</span>`).join("")}</div></section>`:""}</div>`}`;
},

vuelos(){
  const fs=flights();
  const groups={}; fs.filter(f=>f.il&&f.il!=="—").forEach(f=>{(groups[f.il]=groups[f.il]||[]).push(f)});

  if(now<=TRIP_END){ const d=Math.floor((now-TRIP_START)/86400000)+1; return `<div><div class="n">Día ${d}</div><div class="u">de 8 · estamos en Bariloche</div></div>`; }
  return `<div><div class="n">Fin</div><div class="u">hasta el próximo PIBEX</div></div>`;

  if(TAB!=="cuartos"){TAB="cuartos";render();}
  const els=[...document.querySelectorAll("#rooms .name")]; els.forEach(e=>e.classList.add("hid"));
  for(const e of shuffle(els)){ await new Promise(r=>setTimeout(r,matchMedia("(prefers-reduced-motion: reduce)").matches?40:350)); e.classList.remove("hid"); }
  REVEAL=null;
}

/* ================= Imagen ================= */
function resize(file,max){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):ko(new Error("No se pudo procesar")),"image/jpeg",ONLINE?.85:.6);URL.revokeObjectURL(img.src)};img.onerror=()=>ko(new Error("Formato no soportado"));img.src=URL.createObjectURL(file)})}

/* ================= Eventos ================= */
function needMe(){ if(!ME){ loginModal(); return false;} return true; }
document.addEventListener("click", async ev=>{
  const tabBtn=ev.target.closest("[data-tab]");
  if(tabBtn){ TAB=tabBtn.dataset.tab; try{history.replaceState(null,"","#"+TAB)}catch(e){} render(); window.scrollTo({top:0}); return; }
  const pk=ev.target.closest("[data-pick]"); if(pk){ pickName=pk.dataset.pick; pickEmoji=null; paintLogin(); setTimeout(()=>$("#lg-pin")?.focus(),30); return; }
  const em=ev.target.closest("[data-emoji]"); if(em){ pickEmoji=em.dataset.emoji; document.querySelectorAll("[data-emoji]").forEach(b=>b.setAttribute("aria-pressed",b===em)); return; }
  const a=ev.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==="close-bg"){ if(ev.target===a) closeModal(); return; }
  try{
  switch(act){
    case "tl": $("#tabs").scrollBy({left:-220,behavior:"smooth"}); break;
    case "tr": $("#tabs").scrollBy({left:220,behavior:"smooth"}); break;
    case "login": loginModal(); break;
    case "logout": ME=null; lsSet("pibex_me2",null); closeModal(); render(); loginModal(); break;
    case "notif": await pushRefresh(); notifModal(); break;
    case "push-on": if(!needMe())return; a.disabled=true; if(await pushEnable()){ toast("Avisos activados"); notifModal(); } else a.disabled=false; break;
    case "push-off": await pushDisable(); toast("Avisos desactivados"); notifModal(); break;
    case "push-test": a.disabled=true; await pushTest(); a.disabled=false; break;
    case "clike": { if(!needMe())return; const yo=likes(id).find(l=>l.author===ME.name); if(yo) await Store.remove(yo.id); else await Store.add("like",{ref:id}); render(); break; }
    case "edit": EDIT=id; render(); setTimeout(()=>{const t=$("#ed-"+id); if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}},30); break;
    case "edit-cancel": EDIT=null; render(); break;
    case "close": closeModal(); break;
    case "refresh": render(); break;
    case "login-ok": {
      const err=$("#lg-err"); const pin=($("#lg-pin")?.value||"").trim();
      if(!/^\d{4}$/.test(pin)){ err.textContent="El PIN tiene que ser de 4 números."; return; }
      a.disabled=true;
      if(PERFILES[pickName]){
        const r=await Auth.login(pickName,pin,pickEmoji);
        if(r==="bad"){ err.textContent="PIN incorrecto."; a.disabled=false; return; }
        if(r==="emoji"){ err.textContent="Ese escudo lo acaba de agarrar otro. Elegí otro."; await Auth.list(); a.disabled=false; return; }
        if(r!=="ok"){ err.textContent="No se pudo entrar ("+r+")."; a.disabled=false; return; }
      } else {
        if(pin!==($("#lg-pin2")?.value||"").trim()){ err.textContent="Los dos PIN no coinciden."; a.disabled=false; return; }
        if(!pickEmoji){ err.textContent="Elegí tu escudo."; a.disabled=false; return; }
        const r=await Auth.claim(pickName,pin,pickEmoji);
        if(r==="taken"){ err.textContent="Alguien reclamó ese nombre recién. Si no fuiste vos, avisale a la organización."; await Auth.list(); paintLogin(); return; }
        if(r==="emoji"){ err.textContent="Ese escudo ya lo tiene otro."; await Auth.list(); a.disabled=false; return; }
      }
      await Auth.list(); ME={name:pickName}; lsSet("pibex_me2",ME);
      try{ const sub=await pushSub(); if(sub) await sb.rpc("pibex_push_sub",{p_sub:sub.toJSON(),p_name:ME.name}); }catch(e){} closeModal(); render(); toast("Adentro, "+ME.name); break; }
    case "open": OPEN.add(id); render(); break;
    case "toggle": OPEN.has("ev"+id)?OPEN.delete("ev"+id):OPEN.add("ev"+id); render(); break;
    case "del": if(ARM!==id){ ARM=id; a.textContent="¿seguro? tocá de nuevo"; return; } ARM=null; await Store.remove(id); closeModal(); render(); toast("Borrado"); break;
    case "arm": ARM=id; render(); break;
    case "join": { if(!needMe())return; const yo=refs("join",id).find(j=>j.author===ME.name); if(yo) await Store.remove(yo.id); else await Store.add("join",{ref:id}); render(); break; }
    case "ev-ok": { const it=ITEMS.find(i=>i.id===id); await Store.update(id,{status:"ok",by:ME.name}); notify("✅ Plan aprobado: "+it.data.title, dayLabel(it.data.day)+(it.data.time?" "+it.data.time:"")); render(); break; }
    case "ev-no": await Store.update(id,{status:"rechazado",by:ME.name}); render(); break;
    case "postular": if(!needMe())return; await Store.add("postulacion",{ref:id,status:"pendiente"}); render(); toast("Candidatura presentada. La organización decide."); break;
    case "post-ok": { const it=ITEMS.find(i=>i.id===id); await Store.update(id,{status:"ok",by:ME.name}); const v=VACANTES.find(x=>x.id===it.data.ref); notify("🎖️ Nueva designación",it.author+" asume en "+(v?v.name:"un cargo")); render(); break; }
    case "catadd": { const inp=$("#cat-new"); const t=inp.value.trim(); if(!t) return; const cfg=awardsCfg(); await saveAwards({cats:[...cfg.cats,{id:"c"+uid(),title:t}],phase:cfg.phase}); render(); break; }
    case "catdel": { const cfg=awardsCfg(); await saveAwards({cats:cfg.cats.filter(c=>c.id!==id),phase:cfg.phase}); render(); break; }
    case "catsave": { const cfg=awardsCfg(); const cats=cfg.cats.map(c=>{const i=document.querySelector(`[data-cat="${c.id}"]`);return {...c,title:(i&&i.value.trim())||c.title}}); await saveAwards({cats,phase:cfg.phase}); toast("Categorías guardadas"); render(); break; }
    case "aw-open": { ARM=null; const cfg=awardsCfg(); const cats=cfg.cats.map(c=>{const i=document.querySelector(`[data-cat="${c.id}"]`);return {...c,title:(i&&i.value.trim())||c.title}}); await saveAwards({cats,phase:"voting"}); notify("🏆 Choice Awards","¡Se habilitó la votación! Entrá a votar."); render(); break; }
    case "aw-reveal": ARM=null; await saveAwards({phase:"revealed"}); notify("🏆 Choice Awards","¡La organización reveló los ganadores!"); render(); break;
    case "aw-hide": await saveAwards({phase:"hidden"}); render(); break;
    case "aw-reopen": await saveAwards({phase:"voting"}); render(); break;
    case "roomdel": { const cfg=roomsCfg(); await saveRooms({rooms:cfg.rooms.filter(r=>r.id!==id)}); render(); break; }
    case "rm-draw": { ARM=null; const cfg=roomsCfg(); const slots=[]; cfg.rooms.forEach(r=>{for(let i=0;i<r.cap;i++)slots.push(r.id)}); const ppl=shuffle(PEOPLE); const assign={}; ppl.forEach((p,i)=>{if(slots[i])assign[p]=slots[i]});
      // mezclar slots para que no se llenen siempre los primeros cuartos cuando sobran camas
      const mixed=shuffle(slots).slice(0,ppl.length); ppl.forEach((p,i)=>{assign[p]=mixed[i]||undefined; if(!assign[p]) delete assign[p];});
      await saveRooms({assign,drawnAt:new Date().toISOString(),drawnBy:ME.name}); notify("🛏️ ¡Se sortearon los cuartos!","Entrá a ver con quién dormís."); render(); playReveal(); break; }
    case "replay": playReveal(); break;
    case "photo": photoModal(id); break;
    case "psort": PHOTO_SORT=id; render(); break;
    case "like": { if(!needMe())return; const yo=likes(id).find(l=>l.author===ME.name); if(yo) await Store.remove(yo.id); else await Store.add("like",{ref:id}); photoModal(id); break; }
    case "share": { const p=ITEMS.find(i=>i.id===id); if(p) await sharePhoto(p); break; }
    case "copy": { const t=a.dataset.text; try{ await navigator.clipboard.writeText(t); toast("Copiado: "+t);}catch(e){ const c=a.previousElementSibling; if(c){const r=document.createRange();r.selectNodeContents(c);const s=getSelection();s.removeAllRanges();s.addRange(r);} toast("Seleccionado, copialo a mano"); } break; }
  }}catch(e){ console.error(e); toast("No se pudo guardar. Revisá la conexión."); a.disabled=false; }
});
document.addEventListener("change", async ev=>{
  const s=ev.target.closest("[data-vote]"); if(!s) return; if(!needMe()) return;
  try{ const prev=myVote(s.dataset.vote); if(prev) await Store.remove(prev.id); if(s.value) await Store.add("vote",{cat:s.dataset.vote,nominee:s.value}); toast(s.value?"Voto registrado":"Voto retirado"); render(); }catch(e){ toast("No se pudo votar"); }
});
document.addEventListener("submit", async ev=>{
  const f=ev.target.closest("[data-form]"); if(!f) return; ev.preventDefault(); if(!needMe()) return;
  const d=Object.fromEntries(new FormData(f)); const kind=f.dataset.form; const btn=f.querySelector("button"); if(btn) btn.disabled=true;
  const org=isOrg(ME.name);
  try{
    switch(kind){
      case "edit": { const it=ITEMS.find(i=>i.id===f.dataset.id); if(!it||it.author!==ME.name) break; const t=d.text.trim(); if(t&&t!==it.data.text) await Store.update(it.id,{text:t,edited:new Date().toISOString()}); EDIT=null; break; }
      case "comment": { const ref=f.dataset.ref; await Store.add("comment",{ref,text:d.text.trim()}); OPEN.add(ref); notify("💬 "+ME.name+" comentó",d.text); break; }
      case "post": await Store.add("post",{text:d.text.trim()}); notify("📢 "+ME.name+" en el Muro",d.text); break;
      case "comunicado": { if(!org) break; const n=allComunicados().length+1; await Store.add("comunicado",{title:d.title.trim(),body:d.body.trim()}); notify("📜 Comunicado oficial N.º "+n,d.title); break; }
      case "event": { const st=org?"ok":"pendiente"; await Store.add("event",{day:d.day,time:d.time,title:d.title.trim(),desc:d.desc.trim(),status:st,by:org?ME.name:undefined});
        notify(org?"🗓️ Nuevo plan: "+d.title:"📝 Propuesta para revisar: "+d.title, dayLabel(d.day)+(d.time?" "+d.time:"")+" · "+ME.name); toast(org?"Agregado al programa":"Propuesta enviada. La organización la revisa."); break; }
      case "truco": {
        const p1=[d.a1,d.a2], p2=[d.b1,d.b2]; const all=[...p1,...p2];
        if(all.some(x=>!x)||new Set(all).size<4){ toast("Elegí 4 jugadores distintos"); break; }
        const s1=+d.s1, s2=+d.s2; if(s1===s2){ toast("En el truco no hay empate"); break; }
        await Store.add("truco",{p1,p2,s1,s2}); notify("🃏 Truco",`${p1.join(" & ")} ${s1}–${s2} ${p2.join(" & ")}`); break; }
      case "vuelo": { const fx={iv:d.iv||null,is:d.is||null,il:d.il||null,vv:d.vv||null,vs:d.vs||null,vl:d.vl||null}; await Store.add("vuelo",{person:ME.name,f:fx}); toast("Vuelo actualizado"); break; }
      case "pago": if(!isIn("economica",ME.name)) break; await Store.add("pago",{person:d.person,concept:d.concept,amount:+d.amount}); toast("Pago registrado"); break;
      case "place": await Store.add("place",{name:d.name.trim(),note:d.note.trim()}); break;
      case "sorpresa": await Store.add("sorpresa",{text:d.text.trim(),day:d.day}); toast("Enviado a la Comisión"); break;
      case "room": { if(!org) break; const cfg=roomsCfg(); await saveRooms({rooms:[...cfg.rooms,{id:"r"+uid(),name:d.name.trim(),cap:Math.max(1,+d.cap)}]}); break; }
      case "swap": { if(!org) break; if(!d.a||!d.b||d.a===d.b){ toast("Elegí dos personas distintas"); break; } const cfg=roomsCfg(); const as={...cfg.assign}; const t=as[d.a]; if(as[d.b]) as[d.a]=as[d.b]; else delete as[d.a]; if(t) as[d.b]=t; else delete as[d.b]; await saveRooms({assign:as}); toast("Intercambiados"); break; }
      case "photo": {
        const files=[...f.querySelector("input[type=file]").files]; const st=$("#ph-status"); let ok=0, skip=0;
        for(const file of files){
          st.textContent=`Subiendo ${ok+skip+1} de ${files.length}…`;
          const isV=file.type.startsWith("video/");
          if(isV){ if(!ONLINE||file.size>50*1024*1024){ skip++; continue; } const ext=(file.name.split(".").pop()||"mp4").toLowerCase(); const url=await Store.upload(file,ext,file.type); await Store.add("photo",{url,caption:d.caption.trim(),type:"video"}); }
          else { const blob=await resize(file,ONLINE?2048:700); const url=await Store.upload(blob,"jpg","image/jpeg"); await Store.add("photo",{url,caption:d.caption.trim(),type:"image"}); }
          ok++;
        }
        if(skip) toast(`${skip} video${skip>1?"s":""} no se subieron (más de 50 MB${ONLINE?"":" o modo demo"}).`);
        if(ok) notify("📸 "+ME.name+" subió "+ok+(ok===1?" archivo":" archivos"),d.caption||"Entrá a verlos"); break; }
    }
    render();
  }catch(e){ console.error(e); toast("No se pudo guardar. Revisá la conexión."); if(btn) btn.disabled=false; }
});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1); if(TABS.some(x=>x[0]===t)&&t!==TAB){TAB=t;render();}});

/* ================= Arranque ================= */
(async()=>{
  $("#tabs").addEventListener("scroll",updateArrows,{passive:true}); window.addEventListener("resize",updateArrows);
  render();
  lsSet("pibex_seen", Date.now());
  try{ await Store.init(); }catch(e){ console.error(e); toast("No se pudo conectar con la base de datos"); }
  if(ME && !PERFILES[ME.name] && !AUTH_ERR){ ME=null; }
  render();
  pushRefresh();
  if(!ME && !AUTH_ERR) loginModal();
})();
