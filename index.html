<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#172B42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PIBEX">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>PIBEX 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Serif+4:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>

/* Layout: a "Boletín Oficial" for a made-up Patagonian bureaucracy — masthead + sticky tab rail + one column of official sheets. */
:root{
  --paper:#E9EEE9; --sheet:#F7FAF6; --ink:#17212A; --muted:#58666E; --line:#C5CFC9;
  --lake:#1D5878; --pine:#2D5A47; --stamp:#B2352A; --gold:#9A7623;
  --lake-soft:#D7E5EC; --pine-soft:#D8E6DD; --stamp-soft:#F3DCD8; --gold-soft:#EFE5CC;
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E151A; --sheet:#152029; --ink:#E3EAE6; --muted:#93A2A9; --line:#2A3943;
  --lake:#78B6D6; --pine:#86C1A3; --stamp:#EA7466; --gold:#DDB662;
  --lake-soft:#1A3342; --pine-soft:#1A3328; --stamp-soft:#3D1F1C; --gold-soft:#3A3020; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E151A; --sheet:#152029; --ink:#E3EAE6; --muted:#93A2A9; --line:#2A3943;
  --lake:#78B6D6; --pine:#86C1A3; --stamp:#EA7466; --gold:#DDB662;
  --lake-soft:#1A3342; --pine-soft:#1A3328; --stamp-soft:#3D1F1C; --gold-soft:#3A3020; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:860px;margin:0 auto}
a{color:var(--lake)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
h2{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:700}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px}

/* Masthead */
.mast{position:relative;padding-block:28px 18px;border-bottom:3px double var(--ink);display:grid;gap:6px}
.mast-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.mast h1{font-size:clamp(3rem,13vw,6.2rem);font-weight:800;letter-spacing:-.02em;line-height:.9}
.mast h1 em{font-style:italic;font-weight:500;color:var(--lake)}
.mast .sub{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap}
.stamp{position:absolute;right:4px;top:54px;width:118px;height:118px;border:3px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;text-align:center;transform:rotate(-14deg);font-family:var(--f-mono);font-size:.58rem;letter-spacing:.12em;line-height:1.25;text-transform:uppercase;opacity:.85;pointer-events:none}
.stamp::before{content:"";position:absolute;inset:5px;border:1px solid var(--stamp);border-radius:50%}
.stamp b{display:block;font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em}
@media (max-width:560px){.stamp{width:80px;height:80px;top:auto;bottom:34px;right:0;font-size:.42rem}.stamp b{font-size:.78rem}}
.ridge{display:block;width:100%;height:28px;color:var(--pine);margin-top:4px}
.me-chip{display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.iconbtn:hover{border-color:var(--ink)}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.tabs-in{max-width:860px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:12px 11px 10px;cursor:pointer;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--stamp)}
.tab:hover{color:var(--ink)}

main{padding-top:26px;display:grid;gap:22px}
.head{display:grid;gap:6px}
.head p{color:var(--muted);max-width:62ch}

/* Sheets */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.sheet.official{border-top:4px solid var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:10px}

/* Countdown */
.count{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.count .n{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,12vw,4.6rem);line-height:.9;font-variant-numeric:lining-nums tabular-nums}
.count .u{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Forms */
.field{display:grid;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=time],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:9px 10px}
textarea{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--lake);border-color:var(--lake)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--paper)}
.btn.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.sm{padding:5px 10px;font-size:.8rem;font-weight:500}
.link{border:0;background:none;padding:0;color:var(--lake);cursor:pointer;font-size:.85rem;text-decoration:underline;text-underline-offset:2px}
.link.danger{color:var(--stamp)}
.sheet>.link,.sheet>.btn,.sheet>.iconbtn{justify-self:start}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.ok{background:var(--pine-soft);color:var(--pine)}
.warn{background:var(--gold-soft);color:var(--gold)}
.bad{background:var(--stamp-soft);color:var(--stamp)}
.info{background:var(--lake-soft);color:var(--lake)}

/* Official document */
.doc{display:grid;gap:12px}
.doc .num{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.14em;color:var(--stamp);text-transform:uppercase}
.doc h3{font-size:1.6rem}
.doc .body{display:grid;gap:10px;max-width:65ch}
.doc .body h4{font-family:var(--f-display);font-size:1.1rem;margin-top:6px}
.doc .body ul{margin:0;padding-left:20px;display:grid;gap:2px}
.doc .sign{font-family:var(--f-display);font-style:italic;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* Comments */
.thread{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.cmt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.cmt .who{font-weight:600;font-size:.85rem}
.cmt .txt{font-size:.92rem;overflow-wrap:anywhere}
.av{width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:.95rem;line-height:1}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0}

/* Posts */
.post .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.post .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1rem}

/* Schedule */
.day{display:grid;gap:10px}
.dayhead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:4px}
.dayhead h3{font-size:1.5rem}
.ev{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.ev .t{font-family:var(--f-mono);font-weight:600;font-size:.95rem;color:var(--lake)}
.ev.fixed{background:transparent;border-style:dashed}
.ev .ttl{font-weight:600}
.ev .body{display:grid;gap:6px;min-width:0}

/* Tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--paper)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.me td{background:var(--lake-soft)}

/* Progress */
.bar{height:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pine)}
.big{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:lining-nums tabular-nums}

/* Arrivals */
.arr{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.arr:last-child{border-bottom:0}
.arr .t{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1}
.names{display:flex;flex-wrap:wrap;gap:6px}
.name{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:4px;overflow:hidden;background:var(--line);border:0;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:.75rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left}
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,10,14,.92);display:grid;place-items:center;padding:20px;color:#fff}
.lb figure{margin:0;display:grid;gap:10px;max-width:min(1000px,100%)}
.lb img{max-height:78vh;width:auto;margin:0 auto;border-radius:4px}
.lb figcaption{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}
.lb .link{color:#cfe6f2}
.lb .link.danger{color:#ff9d91}

/* Awards */
.aw{display:grid;gap:8px}
.aw h3{font-size:1.15rem}
.res{display:grid;gap:4px}
.res .r{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:.85rem}
.res .r i{display:block;height:8px;background:var(--gold);border-radius:999px}

/* Places */
.places{display:grid;gap:0}
.pl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pl:last-child{border-bottom:0}
.pl .n{font-weight:600}
.pl .d{font-size:.85rem;color:var(--muted)}
.pl a{flex:none;font-family:var(--f-mono);font-size:.75rem}

/* Checklist */
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;accent-color:var(--pine)}
.chk.done .t{text-decoration:line-through;color:var(--muted)}
.chk .t{flex:1;min-width:0;overflow-wrap:anywhere}

/* Committees */
.com{border-left:4px solid var(--ink);display:grid;gap:8px}
.com.vac{border-left-color:var(--line);border-left-style:dashed}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,20,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal .sheet{max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.emojis .chipbtn{font-size:1.15rem;padding:3px 9px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:999px;z-index:70;font-size:.9rem;max-width:calc(100% - 32px)}
.banner{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;font-size:.85rem}
.newpill{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30}
.copybox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copybox code{font-family:var(--f-mono);background:var(--paper);border:1px solid var(--line);padding:4px 8px;border-radius:4px;user-select:all;overflow-wrap:anywhere}
.feed{display:grid;gap:0}
.feed .it{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;font-size:.9rem}
.feed .it:last-child{border-bottom:0}
.empty{color:var(--muted);font-style:italic;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){ main>*{animation:rise .35s ease both} @keyframes rise{from{transform:translateY(6px)}to{transform:none}} }

/* ---- v2 ---- */
.tabs{position:sticky}
.tabs-box{position:relative;max-width:860px;margin:0 auto}
.tabs-in{padding-inline:28px}
.tabarrow{position:absolute;top:0;bottom:1px;width:34px;border:0;cursor:pointer;color:var(--ink);font-size:1.3rem;line-height:1;display:grid;place-items:center;z-index:2;padding:0}
.tabarrow.l{left:-6px;background:linear-gradient(90deg,var(--paper) 55%,transparent)}
.tabarrow.r{right:-6px;background:linear-gradient(270deg,var(--paper) 55%,transparent)}
.tabarrow:disabled{opacity:.18;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;align-content:start;text-align:left;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile .big{font-size:1.9rem}
.tile .lbl{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .sub{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.wx{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px}
.wx div{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px;text-align:center;display:grid;gap:2px;font-size:.8rem}
.wx b{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.wx .e{font-size:1.3rem;line-height:1.1}
.wx .tmp{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sealed{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sealed div{height:86px;border-radius:var(--r);border:1px dashed var(--line);background:repeating-linear-gradient(135deg,var(--sheet),var(--sheet) 8px,var(--paper) 8px,var(--paper) 16px);display:grid;place-items:center;font-family:var(--f-display);font-size:2rem;color:var(--muted)}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.room{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.room.mine{border:2px solid var(--stamp)}
.room h3{font-size:1.2rem}
.room .names .name.hid{visibility:hidden}
.room .names .name.me{background:var(--stamp-soft);border-color:var(--stamp);color:var(--stamp)}
.ph .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:2rem;text-shadow:0 2px 8px rgba(0,0,0,.6);background:none;padding:0}
.ph video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph .lk{position:absolute;top:6px;right:6px;left:auto;bottom:auto;background:rgba(0,0,0,.55);border-radius:999px;padding:1px 7px;font-size:.72rem}
.lb video{max-height:74vh;max-width:100%;margin:0 auto;border-radius:4px;background:#000}
.lb .acts{display:flex;gap:8px;flex-wrap:wrap}
.lb .btn{background:#fff;color:#111;border-color:#fff}
.lb .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.pin{font-family:var(--f-mono);letter-spacing:.5em;font-size:1.3rem;text-align:center;max-width:180px}
.chipbtn:disabled{opacity:.3;cursor:not-allowed}
.chipbtn .lock{font-size:.7rem;margin-left:4px;opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fact{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:3px}
.fact .lbl{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact b{font-family:var(--f-display);font-size:1.15rem}
.org{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.org>.eyebrow{color:var(--gold)}
.catedit{display:flex;gap:6px;align-items:center}
.catedit input{flex:1;min-width:0}
.thumb{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:4px;display:block;background:var(--line)}
.tab{position:relative}
.tab .dot{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:5px;border-radius:999px;background:var(--stamp);color:#fff;font-size:.62rem;letter-spacing:0;vertical-align:1px}
.likebar{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.likebtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.82rem;line-height:1.5}
.likebtn.on{border-color:var(--stamp);background:var(--stamp-soft)}
.likebtn b{font-family:var(--f-mono);font-weight:600}
.wxnow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.wxnow>.e{font-size:2.6rem;line-height:1}
@media (max-width:480px){.wxnow{grid-template-columns:auto 1fr}.wxnow .btn{grid-column:1/-1;justify-self:start}}
.wxscroll{overflow-x:auto;margin-inline:-4px;padding:4px}
.wxscroll .wx{display:grid;grid-auto-flow:column;grid-auto-columns:84px;grid-template-columns:none}
.wx div.trip{border:2px solid var(--gold);background:var(--gold-soft)}
#wx{min-width:0;display:grid;gap:10px}
.sheet>*{min-width:0}
.wxnow{grid-template-columns:auto 1fr}

const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const usd=n=>"USD "+Number(n||0).toLocaleString("es-AR");
const ars=n=>"$"+Number(n||0).toLocaleString("es-AR");
const pct=(a,b)=>b?Math.round(a/b*100):0;
function ago(iso){const s=(Date.now()-new Date(iso))/1000;if(s<60)return"recién";if(s<3600)return"hace "+Math.floor(s/60)+" min";if(s<86400)return"hace "+Math.floor(s/3600)+" h";const d=Math.floor(s/86400);return d===1?"ayer":"hace "+d+" días"}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= Datos compartidos ================= */
let ITEMS=[], sb=null, PERFILES={};
const ONLINE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const Store = {
  async init(){
    if(ONLINE){
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js");
      sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
      await this.reload();
      sb.channel("items").on("postgres_changes",{event:"*",schema:"public",table:"items"},async()=>{await this.reload();liveRefresh()}).subscribe();
    } else { ITEMS = lsGet("pibex_items")||[]; }
    await Auth.list();
  },
  async reload(){ const {data,error}=await sb.from("items").select("*").order("created_at",{ascending:true}); if(!error) ITEMS=data; },
  persist(){ if(!lsSet("pibex_items",ITEMS)) toast("No entra más en el modo demo."); },
  async add(kind,data,author){
    const row={kind,data,author:author||ME.name};
    if(ONLINE){ const {data:r,error}=await sb.from("items").insert(row).select().single(); if(error) throw error; ITEMS.push(r); return r; }
    const r={...row,id:uid(),created_at:new Date().toISOString()}; ITEMS.push(r); this.persist(); return r;
  },
  async update(id,data){
    const it=ITEMS.find(i=>i.id===id); if(!it) return; it.data={...it.data,...data};
    if(ONLINE){ const {error}=await sb.from("items").update({data:it.data}).eq("id",id); if(error) throw error; } else this.persist();
  },
  async remove(id){
    ITEMS=ITEMS.filter(i=>i.id!==id);
    if(ONLINE){ const {error}=await sb.from("items").delete().eq("id",id); if(error) throw error; } else this.persist();
  },
  /* Fotos, videos y audios: Cloudinary si está configurado (25 GB gratis), si no Supabase */
  async media(blob,kind,ext,type){
    if(ONLINE && CONFIG.CLOUDINARY_CLOUD){
      const fd=new FormData(); fd.append("file",blob,"pibex."+ext); fd.append("upload_preset",CONFIG.CLOUDINARY_PRESET); fd.append("folder","pibex2026/"+kind);
      const r=await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.CLOUDINARY_CLOUD}/${kind==="foto"?"image":"video"}/upload`,{method:"POST",body:fd});
      const j=await r.json(); if(!r.ok||!j.secure_url) throw new Error((j.error&&j.error.message)||"Cloudinary rechazó el archivo");
      const u=j.secure_url, tr=(t,ext2)=>{ let x=u.replace("/upload/","/upload/"+t+"/"); if(ext2) x=x.replace(/\.[a-z0-9]+$/i,"."+ext2); return x; };
      if(kind==="foto") return {url:tr("q_auto,f_auto"),thumb:tr("c_fill,w_480,h_480,q_auto,f_auto"),dl:tr("fl_attachment")};
      if(kind==="video") return {url:u,thumb:tr("so_1,c_fill,w_480,h_480,q_auto","jpg"),dl:tr("fl_attachment")};
      return {url:tr("q_auto","mp3")};
    }
    const url=await this.upload(blob,ext,type);
    return {url,dl:ONLINE?url+"?download=pibex2026."+ext:url};
  },
  async upload(blob,ext,type){
    if(ONLINE){ const path=Date.now()+"-"+uid()+"."+ext; const {error}=await sb.storage.from("fotos").upload(path,blob,{contentType:type}); if(error) throw error; return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl; }
    return await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(blob)});
  }
};
const of = k => ITEMS.filter(i=>i.kind===k);
const refs = (k,ref) => ITEMS.filter(i=>i.kind===k && i.data.ref===ref);
const latest = k => of(k).pop();

/* ---- Usuarios con PIN (el PIN vive en la base, nadie lo puede leer) ---- */
const Auth = {
  async list(){
    if(ONLINE){ const {data,error}=await sb.rpc("pibex_perfiles"); if(error){ console.error(error); AUTH_ERR=true; return; } PERFILES=Object.fromEntries((data||[]).map(r=>[r.name,r.emoji])); }
    else { const p=lsGet("pibex_perfiles")||{}; PERFILES=Object.fromEntries(Object.entries(p).map(([n,v])=>[n,v.emoji])); }
  },
  async claim(name,pin,emoji){
    if(ONLINE){ const {data,error}=await sb.rpc("pibex_claim",{p_name:name,p_pin:pin,p_emoji:emoji}); if(error) throw error; return data; }
    const p=lsGet("pibex_perfiles")||{}; if(p[name]) return "taken"; if(Object.values(p).some(v=>v.emoji===emoji)) return "emoji";
    p[name]={pin,emoji}; lsSet("pibex_perfiles",p); return "ok";
  },
  async reset(admin,pin,name){
    if(ONLINE){ const {data,error}=await sb.rpc("pibex_reset_pin",{p_admin:admin,p_admin_pin:pin,p_name:name}); if(error) throw error; return data; }
    const p=lsGet("pibex_perfiles")||{}; if(!SUPER.includes(admin)) return "noadmin"; if(!p[admin]||p[admin].pin!==pin) return "bad"; delete p[name]; lsSet("pibex_perfiles",p); return "ok";
  },
  async login(name,pin,emoji){
    if(ONLINE){ const {data,error}=await sb.rpc("pibex_login",{p_name:name,p_pin:pin,p_emoji:emoji||null}); if(error) throw error; return data; }
    const p=lsGet("pibex_perfiles")||{}; if(!p[name]) return "nouser"; if(p[name].pin!==pin) return "bad";
    if(emoji){ if(Object.entries(p).some(([n,v])=>v.emoji===emoji&&n!==name)) return "emoji"; p[name].emoji=emoji; lsSet("pibex_perfiles",p); }
    return "ok";
  }
};

const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const PUSH_OK = ONLINE && !!CONFIG.VAPID_PUBLIC && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let PUSH_ON = false;
function b64u(str){ const p="=".repeat((4-str.length%4)%4); const b=atob((str+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); }
async function pushSub(){ if(!PUSH_OK) return null; const reg=await navigator.serviceWorker.getRegistration(); return reg? await reg.pushManager.getSubscription() : null; }
async function pushRefresh(){ try{ PUSH_ON = !!(await pushSub()) && Notification.permission==="granted"; }catch(e){ PUSH_ON=false; } paintBell(); }
function paintBell(){ const b=$("#bell"); if(b) b.innerHTML = PUSH_ON ? "🔔 Avisos activados" : "🔕 Activar avisos"; }
async function pushEnable(){
  const reg=await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){ toast("No diste permiso. Se habilita desde los ajustes del navegador."); return false; }
  let sub;
  try{ sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(CONFIG.VAPID_PUBLIC)}); }
  catch(e){ console.error(e); const brave=!!(navigator.brave); toast(brave?"Brave bloquea los avisos: activá «Usar servicios de Google para mensajes push» en brave://settings/privacy":"Tu navegador no dejó activar los avisos. Probá con Chrome."); return false; }
  const {error}=await sb.rpc("pibex_push_sub",{p_sub:sub.toJSON(),p_name:ME?ME.name:null}); if(error) throw error;
  PUSH_ON=true; paintBell(); return true;
}
async function pushDisable(){ const sub=await pushSub(); if(sub){ try{ await sb.rpc("pibex_push_unsub",{p_endpoint:sub.endpoint}); }catch(e){} await sub.unsubscribe(); } PUSH_ON=false; paintBell(); }
async function pushTest(){ const sub=await pushSub(); if(!sub) return; const {data,error}=await sb.functions.invoke("notify",{body:{title:"PIBEX 2026",body:"Así te van a llegar los avisos. ¡Salud!",test_endpoint:sub.endpoint,url:location.href.split("#")[0]}}); if(error) throw error; toast(data&&data.sent?"Aviso enviado: mirá el celu":"No se pudo enviar el aviso de prueba"); }

/* ---- Audios tipo WhatsApp ---- */
let REC=null;
function pickMime(){ const c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"]; try{ return c.find(m=>MediaRecorder.isTypeSupported(m))||""; }catch(e){ return ""; } }
const fmtDur=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function recSlot(key){
  if(REC&&REC.key===key&&REC.mr) return `<button type="button" class="micbtn rec" data-act="rec-stop">⏹ Parar · ${fmtDur(Math.floor((Date.now()-REC.start)/1000))}</button>`;
  if(REC&&REC.key===key&&REC.blob) return `<span class="recprev"><audio controls src="${REC.url}"></audio><button type="button" class="link danger" data-act="rec-clear">descartar</button></span>`;
  return `<button type="button" class="micbtn" data-act="rec-start" data-id="${esc(key)}" aria-label="Grabar audio">🎙️ Audio</button>`;
}
function paintRec(){ document.querySelectorAll("[data-slot]").forEach(sl=>{ sl.innerHTML=recSlot(sl.dataset.slot); }); }
async function recStart(key){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ toast("Este navegador no permite grabar audio."); return; }
  if(REC&&REC.mr) return; if(REC) recClear();
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast("Sin permiso de micrófono. Habilitalo en el navegador."); return; }
  const mime=pickMime(); const mr=new MediaRecorder(stream, mime?{mimeType:mime,audioBitsPerSecond:40000}:{audioBitsPerSecond:40000});
  const chunks=[]; const start=Date.now();
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); clearInterval(REC&&REC.timer); const type=(mr.mimeType||mime||"audio/webm").split(";")[0]; const blob=new Blob(chunks,{type}); REC={key,blob,url:URL.createObjectURL(blob),mime:type,dur:Math.max(1,Math.round((Date.now()-start)/1000))}; paintRec(); };
  REC={key,mr,start,stream}; mr.start(250); paintRec();
  REC.timer=setInterval(()=>{ if(!REC||!REC.mr) return; paintRec(); if(Date.now()-start>180000){ toast("Máximo 3 minutos"); recStop(); } },500);
}
function recStop(){ if(REC&&REC.mr){ clearInterval(REC.timer); const mr=REC.mr; mr.stop(); } }
function recClear(){ if(REC&&REC.mr){ clearInterval(REC.timer); REC.mr.onstop=null; try{REC.mr.stop()}catch(e){} REC.stream.getTracks().forEach(t=>t.stop()); } if(REC&&REC.url) URL.revokeObjectURL(REC.url); REC=null; paintRec(); }
async function takeAudio(key){
  if(!(REC&&REC.key===key&&REC.blob)) return null;
  const ext=REC.mime.includes("mp4")?"m4a":REC.mime.includes("ogg")?"ogg":"webm";
  const {url}=await Store.media(REC.blob,"audio",ext,REC.mime); const dur=REC.dur; recClear(); return {audio:url,dur};
}
const audioEl = it => it.data.audio?`<div class="aud"><audio controls preload="none" src="${esc(it.data.audio)}"></audio><span class="muted small">🎙️ ${fmtDur(it.data.dur||0)}</span></div>`:"";

function docBody(text){

/* ---- Truco ---- */
const tmode = m => (m.data.mode||4);
const tOk = m => m.data.ok!==false;
const tLosers = d => d.s1>d.s2 ? d.p2 : d.p1;
const tCanConfirm = m => ME && !tOk(m) && (tLosers(m.data).includes(ME.name) || SUPER.includes(ME.name));
const autoOk = d => tLosers(d).includes(ME.name) || SUPER.includes(ME.name);
const teamName = t => t.join(" & ");
function trucoStats(mode){
  const ind={}, par={}; const ms=of("truco").filter(m=>tOk(m)&&(!mode||tmode(m)===mode));
  const bump=(o,k,won,pf,pc)=>{o[k]=o[k]||{k,pj:0,pg:0,pp:0,pf:0,pc:0,seq:[]};const r=o[k];r.pj++;won?r.pg++:r.pp++;r.pf+=pf;r.pc+=pc;r.seq.push(won)};
  ms.forEach(m=>{const d=m.data;const w1=d.s1>d.s2;

function ligaTable(t){

  const fixtures=[]; for(let a=0;a<t.teams.length;a++) for(let b=a+1;b<t.teams.length;b++){ const mid=`l${a}-${b}`; const r=tResult(t.id,mid); fixtures.push({mid,a,b,r});

function bracket(t){

  let cur=[...t.order.map(i=>i),...Array(size-t.teams.length).fill("BYE")];

  if(size>t.teams.length){ const real=t.order.slice(), byes=size-t.teams.length; cur=[]; for(let k=0;k<size/2;k++){ cur.push(real.shift()); cur.push(k<byes?"BYE":real.shift()); } }

    for(let k=0;k<cur.length/2;k++){ const a=cur[2*k], b=cur[2*k+1], mid=`r${r}m${k}`; let w;
      if(a==="BYE"&&b==="BYE") w="BYE"; else if(b==="BYE") w=a; else if(a==="BYE") w=b; else if(a==null||b==null) w=null;
      else { const res=tResult(t.id,mid); w=res?(res.data.s1>res.data.s2?a:b):null; ms.push({mid,a,b,res,w}); next.push(w); continue; }

    <div class="field"><label for="com-t">Título</label><input type="text" id="com-t" name="title" required></div>
    <div class="field"><label for="com-b">Texto</label><textarea id="com-b" name="body" rows="8" required placeholder="Usá ## para subtítulos y - para listas"></textarea></div>
    <div><button class="btn">Emitir y avisar a todos</button></div></form>`:""}
  ${list.map(c=>`<article class="sheet official doc" id="${c.id}">
    <div class="dochead"><img class="seal" src="logo.png" alt="" width="54" height="54"><div class="stack" style="gap:4px"><span class="num">Comunicado oficial N.º ${c.num} · PIBEX 2026 · Bariloche</span><h3>${esc(c.data.title)}</h3></div></div>
    <div class="body">${docBody(c.data.body)}</div>
    <p class="sign">${c.author!=="Comisión"&&isIn("economica",c.author)?"Comisión Organizativa Económica":"Comisión Organizativa Creativa Barilochense"}${c.author!=="Comisión"?` · firmado por ${esc(c.author)}`:""} ${c.id.startsWith("seed")?"":delBtn(c)}</p>

cronograma(){
  const evs=allEvents(); const org=ME&&can("cronograma",ME.name);
  const pend=evs.filter(e=>!e.fixed&&e.status==="pendiente");
  const rej=evs.filter(e=>!e.fixed&&e.status==="rechazado"&&(org||(ME&&e.item.author===ME.name)));
  return `<div class="head"><span class="eyebrow">Programa general · 24 al 31 de octubre</span><h2>Cronograma</h2><p>Cualquiera propone; la organización valida. Lo aprobado entra al programa oficial.</p></div>
  <form class="sheet" data-form="event"><span class="eyebrow">Proponer un plan</span>
    <div class="fgrid">
      <div class="field"><label for="ev-d">Día</label><select id="ev-d" name="day">${DAYS.map(d=>`<option value="${d[0]}">${d[1]}</option>`).join("")}</select></div>
      <div class="field"><label for="ev-h">Hora</label><input type="time" id="ev-h" name="time"></div></div>
    <div class="field"><label for="ev-t">Qué</label><input type="text" id="ev-t" name="title" required placeholder="Ej: Catamarán a Isla Victoria"></div>
    <div class="field"><label for="ev-x">Detalle</label><input type="text" id="ev-x" name="desc" placeholder="Precio, punto de encuentro, qué llevar"></div>
    <div><button class="btn">${org?"Agregar al programa":"Enviar propuesta"}</button></div></form>
  ${pend.length?`<section class="org"><span class="eyebrow">Propuestas en revisión · ${pend.length}</span>${pend.map(evHTML).join("")}</section>`:""}
  ${DAYS.map(([d,l])=>{const list=evs.filter(e=>e.day===d&&(e.fixed||e.status==="ok")).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
    return `<section class="day"><div class="dayhead"><h3>${l}</h3><span class="eyebrow">${list.length} ${list.length===1?"plan":"planes"}</span></div>${list.length?list.map(evHTML).join(""):`<p class="empty">Día libre. Por ahora.</p>`}</section>`;}).join("")}
  ${rej.length?`<section class="sheet"><span class="eyebrow">Rechazadas</span>${rej.map(e=>`<div class="row between small"><span>${esc(e.title)} · ${esc(e.dayLabel)}</span><span class="muted">${esc(e.item.author)} ${delBtn(e.item)}</span></div>`).join("")}</section>`:""}`;
},

muro(){
  const posts=of("post").slice().reverse();
  return `<div class="head"><span class="eyebrow">Foro general</span><h2>El Muro</h2><p>Ideas, preguntas, chicanas, todo. Cada publicación avisa al celular de los que activaron los avisos.</p></div>
  <form class="sheet" data-form="post"><div class="field"><label for="post-t">Publicar</label><textarea id="post-t" name="text" maxlength="2000" placeholder="¿Quién lleva el parlante? (o mandá un audio)"></textarea></div><div class="row"><span data-slot="post">${recSlot("post")}</span><button class="btn">Publicar</button></div></form>
  ${posts.length?posts.map(p=>`<article class="sheet post"><div class="meta">${av(p.author)}<b>${esc(p.author)}</b><span class="muted small">${ago(p.created_at)}</span>${editBtn(p)}${delBtn(p)}</div>${msgText(p,"txt")}${likeBar(p.id)}${thread(p.id,"respuestas")}</article>`).join(""):`<p class="empty">Nadie escribió todavía. Inaugurá el muro.</p>`}`;
},

fotos(){
  let ph=of("photo").slice().reverse(); if(PHOTO_SORT==="top") ph.sort((a,b)=>likes(b.id).length-likes(a.id).length);
  return `<div class="head"><span class="eyebrow">Archivo audiovisual</span><h2>Fotos y videos</h2><p>Elegí varias de una: fotos y videos juntos. En el celu, «Compartir» abre WhatsApp, Instagram (historia o post) y el resto de tus apps.</p></div>
  <form class="sheet" data-form="photo"><div class="fgrid">
    <div class="field"><label for="ph-f">Fotos y videos (podés elegir varios)</label><input type="file" id="ph-f" name="files" accept="image/*,video/*" multiple required></div>
    <div class="field"><label for="ph-c">Epígrafe para todas (opcional)</label><input type="text" id="ph-c" name="caption" maxlength="140"></div></div>
    <div class="row"><button class="btn" id="ph-btn">Subir</button><span class="muted small" id="ph-status">Videos de hasta 50 MB (unos 30 segundos en buena calidad).</span></div></form>
  ${ph.length?`<div class="row between"><span class="eyebrow">${ph.length} archivos</span><div class="seg"><button data-act="psort" data-id="new" aria-pressed="${PHOTO_SORT==="new"}">Recientes</button><button data-act="psort" data-id="top" aria-pressed="${PHOTO_SORT==="top"}">Más likeadas</button></div></div>
  <div class="photos">${ph.map(p=>{const n=likes(p.id).length;return `<button class="ph" data-act="photo" data-id="${p.id}">${p.data.type==="video"?(p.data.thumb?`<img src="${esc(p.data.thumb)}" alt="Video de ${esc(p.author)}" loading="lazy"><span class="play">▶</span>`:`<video src="${esc(p.data.url)}#t=0.5" muted playsinline preload="none"></video><span class="vidbg"></span><span class="play">▶</span>`):`<img src="${esc(p.data.thumb||p.data.url)}" alt="${esc(p.data.caption||"Foto de "+p.author)}" loading="lazy">`}${n?`<span class="lk">❤️ ${n}</span>`:""}<span>${esc(p.data.caption||p.author)}</span></button>`}).join("")}</div>`:`<p class="empty">Todavía no hay nada. Arranquen con una del 2015 para calentar.</p>`}`;
},

truco(){
  const head=`<div class="head"><span class="eyebrow">Campeonato Patagónico de Truco</span><h2>Truco</h2></div>
  <div class="seg big2"><button data-act="tsub" data-id="partidos" aria-pressed="${TRUCO_SUB==="partidos"}">Partidos y rankings</button><button data-act="tsub" data-id="anotador" aria-pressed="${TRUCO_SUB==="anotador"}">Anotador</button><button data-act="tsub" data-id="torneos" aria-pressed="${TRUCO_SUB==="torneos"}">Torneos</button></div>`;
  const champs=torneos().map(t=>({t,c:champOf(t)})).filter(x=>x.c);
  const fame=champs.length?`<section class="sheet official"><span class="eyebrow">Salón de la fama</span>${champs.slice().reverse().map(({t,c})=>`<div class="row between"><span>🏆 <b>${esc(teamName(c))}</b></span><span class="muted small">${esc(t.name)} · de a ${t.mode}</span></div>`).join("")}</section>`:"";
  const pend=of("truco").filter(m=>!tOk(m));
  const pendBox=pend.length?`<section class="org"><span class="eyebrow">Partidos a confirmar · ${pend.length}</span><p class="small">Cuentan cuando confirma alguien del equipo que perdió.</p>
    ${pend.map(m=>{const d=m.data;const w=d.s1>d.s2;return `<div class="stack" style="gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px"><span><b>${esc(teamName(w?d.p1:d.p2))}</b> le ganó <span class="mono">${Math.max(d.s1,d.s2)}–${Math.min(d.s1,d.s2)}</span> a <b>${esc(teamName(w?d.p2:d.p1))}</b></span>
      <span class="small muted">Cargó ${esc(m.author)} · ${ago(m.created_at)}</span>
      ${tCanConfirm(m)?`<div class="row"><button class="btn sm" data-act="tconf" data-id="${m.id}">✓ Confirmar</button><button class="btn ghost sm" data-act="trej" data-id="${m.id}">✗ No fue así</button></div>`:`<span class="small">Esperando que confirme ${esc(tLosers(d).join(" o "))}.</span>`}</div>`}).join("")}</section>`:"";
  if(TRUCO_SUB==="torneos") return head+pendBox+fame+torneosView();
  if(TRUCO_SUB==="anotador") return head+pendBox+anotadorView();
  const sz=TRUCO_MODE/2, lbl=TRUCO_MODE===4?"Pareja":"Equipo";
  const sideSel=(side)=>[...Array(sz)].map((_,j)=>`<select id="t-${side}${j+1}" name="${side}${j+1}" data-grp="t" data-team="${side==="a"?0:1}" aria-label="${lbl} ${side==="a"?1:2}, jugador ${j+1}">${personOpts()}</select>`).join("");
  return head+pendBox+`
  <form class="sheet" data-form="truco"><span class="eyebrow">Cargar partido suelto</span>
    <div class="row"><span class="small">Modalidad:</span><div class="seg"><button type="button" data-act="tmode" data-id="4" aria-pressed="${TRUCO_MODE===4}">De a 4 · 2 parejas</button><button type="button" data-act="tmode" data-id="6" aria-pressed="${TRUCO_MODE===6}">De a 6 · 3 contra 3</button></div></div>
    <div class="grid2">
      <div class="stack"><b>${lbl} 1</b><div class="fgrid">${sideSel("a")}</div><div class="field"><label for="t-s1">Puntos</label><input type="number" id="t-s1" name="s1" min="0" max="40" required></div></div>
      <div class="stack"><b>${lbl} 2</b><div class="fgrid">${sideSel("b")}</div><div class="field"><label for="t-s2">Puntos</label><input type="number" id="t-s2" name="s2" min="0" max="40" required></div></div>
    </div><p class="small muted">Un jugador no puede estar en los dos lados.</p><div><button class="btn">Cargar resultado</button></div></form>
  ${fame}
  ${[4,6].map(rankBlock).join("")}
  ${(()=>{const ms=of("truco");return ms.length?`<section class="sheet"><span class="eyebrow">Historial</span>${ms.slice().reverse().map(m=>{const d=m.data;const w=d.s1>d.s2;const t=d.tid&&torneos().find(x=>x.id===d.tid);return `<div class="row between small"><span><b style="${w?"":"font-weight:400"}">${esc(teamName(d.p1))}</b> <span class="mono">${d.s1}–${d.s2}</span> <b style="${w?"font-weight:400":""}">${esc(teamName(d.p2))}</b> <span class="pill info">de a ${tmode(m)}</span>${t?` <span class="pill warn">${esc(t.name)}</span>`:""}${tOk(m)?"":` <span class="pill bad">a confirmar</span>`}</span><span class="muted">${ago(m.created_at)} · ${esc(m.author)} ${delBtn(m)}</span></div>`}).join("")}</section>`:""})()}`;
},

awards(){
  const cfg=awardsCfg(); const org=ME&&can("awards",ME.name); const voters=new Set(of("vote").map(v=>v.author)).size;
  const head=`<div class="head"><span class="eyebrow">Ceremonia de cierre · viernes 30 a la noche</span><h2>PIBEX Choice Awards</h2></div>`;
  const panel = org?`<section class="org"><span class="eyebrow">Panel de la organización · solo lo ven ustedes 6</span>
    ${cfg.phase==="hidden"?`<p class="small">Las categorías están ocultas para el resto. Editen, borren o sumen, y cuando estén conformes habiliten la votación.</p>
      ${cfg.cats.map(c=>`<div class="catedit"><input type="text" id="cat-${c.id}" data-cat="${c.id}" value="${esc(c.title)}" aria-label="Categoría"><button class="link danger" data-act="catdel" data-id="${c.id}">quitar</button></div>`).join("")}
      <div class="catedit"><input type="text" id="cat-new" placeholder="Nueva categoría" aria-label="Nueva categoría"><button class="btn sm" data-act="catadd">Sumar</button></div>
      <div class="row"><button class="btn ghost sm" data-act="catsave">Guardar cambios</button>${armBtn("aw-open","Habilitar votación para todos","Confirmar: habilitar votación","aw-open")}</div>`
    :cfg.phase==="voting"?`<p class="small">Votación abierta. ${voters} de ${PEOPLE.length} votaron.</p><div class="row">${armBtn("aw-reveal","Revelar resultados","Confirmar: revelar a todos","aw-reveal")}<button class="btn ghost sm" data-act="aw-hide">Volver a ocultar</button></div>`
    :`<div class="row"><button class="btn ghost sm" data-act="aw-reopen">Volver a votación</button></div>`}
  </section>`:"";
  if(cfg.phase==="hidden") return head+panel+`<section class="sheet official"><span class="eyebrow">Sobre lacrado</span><h3>${cfg.cats.length} categorías en deliberación</h3><p class="muted">La organización está definiendo las ternas. Cuando las habilite, te llega el aviso y podés votar.</p><div class="sealed">${cfg.cats.map(()=>`<div>?</div>`).join("")}</div></section>`;
  const rev=cfg.phase==="revealed";
  return head+panel+`<section class="sheet"><div class="row between"><span><span class="big">${voters}</span> <span class="muted">de ${PEOPLE.length} ya votaron</span></span><span class="pill ${rev?"ok":"info"}">${rev?"Resultados revelados":"Voto secreto hasta la ceremonia"}</span></div>${rev?"":`<p class="small muted">Votá una vez por categoría. Podés cambiar el voto hasta la revelación.</p>`}</section>
  <div class="grid2">${cfg.cats.map(c=>{const mv=myVote(c.id);const t=tally(c.id);const max=t[0]?t[0][1]:1;
    return `<section class="sheet aw"><h3>${esc(c.title)}</h3>${rev?`<div class="res">${t.length?t.slice(0,3).map(([n,v],i)=>`<div class="r"><span>${i===0?"🏆 ":""}${esc(n)}</span><i style="width:${v/max*100}%"></i><span class="mono">${v}</span></div>`).join(""):`<p class="empty">Sin votos.</p>`}</div>`
      :`<select data-vote="${esc(c.id)}" id="v-${esc(c.id)}" aria-label="Tu voto: ${esc(c.title)}">${personOpts(mv?mv.data.nominee:"","Tu voto…")}</select>`}</section>`}).join("")}</div>`;
},

cuartos(){
  const cfg=roomsCfg(); const org=ME&&can("cuartos",ME.name); const cap=cfg.rooms.reduce((s,r)=>s+Number(r.cap||0),0);
  const drawn=!!cfg.drawnAt; const draws=cfg.draws||(drawn?1:0); const sinCuarto=drawn?CASA.filter(p=>!cfg.assign[p]):[];
  const panel=org?`<section class="org"><span class="eyebrow">Panel de la organización</span>
    ${cfg.rooms.length?cfg.rooms.map(r=>`<div class="row between small"><span><b>${esc(r.name)}</b> · ${r.cap} camas</span>${drawn?"":`<button class="link danger" data-act="roomdel" data-id="${r.id}">quitar</button>`}</div>`).join(""):`<p class="small">Carguen los cuartos de la mansión y cuántas camas tiene cada uno.</p>`}
    ${drawn?"":`<form class="fgrid" data-form="room"><input type="text" id="rm-n" name="name" placeholder="Nombre (ej: Suite del lago)" required aria-label="Nombre del cuarto"><input type="number" id="rm-c" name="cap" min="1" max="12" placeholder="Camas" required aria-label="Camas"><button class="btn sm">Agregar cuarto</button></form>`}
    <p class="small">Camas cargadas: <b>${cap}</b> para ${CASA.length} personas.${cap<CASA.length&&cfg.rooms.length?" Los que sobren quedan en el living.":""} Los ${LOCALES.length} que viven en Bariloche no entran en el sorteo.</p>
    ${cfg.rooms.length?(draws<MAX_DRAWS?`<div class="row">${armBtn("rm-draw",`🎲 Sortear (intento ${draws+1} de ${MAX_DRAWS})`,draws?"Confirmar: se reemplaza el sorteo anterior":"Confirmar sorteo","rm-draw")}</div>`:`<p class="small"><span class="pill warn">Sorteo cerrado</span> Se usaron los ${MAX_DRAWS} intentos.${SUPER.includes(ME.name)?` <button class="link" data-act="rm-reopen">Reabrir intentos</button>`:""}</p>`):""}
    ${drawn?`<form class="fgrid" data-form="swap"><select id="sw-a" name="a" aria-label="Persona 1">${personOpts("","Intercambiar a…",CASA)}</select><select id="sw-b" name="b" aria-label="Persona 2">${personOpts("","…con",CASA)}</select><button class="btn ghost sm">Intercambiar</button></form>`:""}
  </section>`:"";
  return `<div class="head"><span class="eyebrow">Distribución habitacional · por sorteo</span><h2>Cuartos</h2><p>Dónde duerme cada uno. Lo sortea la organización y es inapelable (salvo coima en fernet).</p></div>
  ${panel}
  ${!drawn?`<section class="sheet official"><span class="eyebrow">Estado</span><h3>Sorteo pendiente</h3><p class="muted">${cfg.rooms.length?`Hay ${cfg.rooms.length} cuartos cargados. La organización avisa cuando se sortea.`:"Todavía no está definido cómo es la mansión por dentro."}</p></section>`
  :`<section class="sheet"><div class="row between"><span class="small muted">Intento ${draws} de ${MAX_DRAWS} · sorteado ${ago(cfg.drawnAt)} por ${esc(cfg.drawnBy||"la organización")}</span><button class="btn ghost sm" data-act="replay" data-id="rooms">▶ Revivir el sorteo</button></div></section>
   <div class="rooms" id="rooms">${cfg.rooms.map(r=>{const ps=CASA.filter(p=>cfg.assign[p]===r.id);const mine=ME&&ps.includes(ME.name);
     return `<section class="room ${mine?"mine":""}"><span class="eyebrow">${ps.length}/${r.cap} camas${mine?" · tu cuarto":""}</span><h3>${esc(r.name)}</h3><div class="names">${ps.map(p=>`<span class="name ${ME&&p===ME.name?"me":""}">${esc(emojiOf(p))} ${esc(p)}</span>`).join("")}</div></section>`}).join("")}
     ${sinCuarto.length?`<section class="room"><span class="eyebrow">Sin cama asignada</span><h3>Living</h3><div class="names">${sinCuarto.map(p=>`<span class="name ${ME&&p===ME.name?"me":""}">${esc(p)}</span>`).join("")}</div></section>`:""}</div>`}`;
},

equipos(){
  const cfg=teamsCfg(); const org=ME&&can("equipos",ME.name); const drawn=!!cfg.drawnAt; const draws=cfg.draws||(drawn?1:0);
  const n=cfg.count; const names=[...Array(n)].map((_,i)=>cfg.names[i]||TEAM_NAMES[i]||"Equipo "+(i+1));
  const nightsOf=i=>NIGHTS.filter((_,k)=>k%n===i);
  const panel=org?`<section class="org"><span class="eyebrow">Panel de la organización</span>
    <form class="stack" data-form="teams" style="gap:8px">
      <div class="field" style="max-width:220px"><label for="tm-n">Cantidad de equipos</label><select id="tm-n" name="count" ${drawn?"disabled":""}>${[2,3,4,5,6,7].map(k=>`<option ${k===n?"selected":""}>${k}</option>`).join("")}</select></div>
      ${names.map((nm,i)=>`<div class="field"><label for="tm-${i}">Nombre del equipo ${i+1}</label><input type="text" id="tm-${i}" name="name${i}" value="${esc(nm)}" maxlength="40"></div>`).join("")}
      <div><button class="btn ghost sm">Guardar nombres${drawn?"":" y cantidad"}</button></div>
    </form>
    <p class="small">Se reparten los ${CASA.length} que duermen en la casa, parejo entre ${n} equipos (unos ${Math.floor(CASA.length/n)} por equipo). Los ${LOCALES.length} de Bariloche no entran.</p>
    ${draws<MAX_DRAWS?`<div class="row">${armBtn("tm-draw",`🎲 Sortear equipos (intento ${draws+1} de ${MAX_DRAWS})`,draws?"Confirmar: se reemplaza el sorteo anterior":"Confirmar sorteo","tm-draw")}</div>`:`<p class="small"><span class="pill warn">Sorteo cerrado</span> Se usaron los ${MAX_DRAWS} intentos.${SUPER.includes(ME.name)?` <button class="link" data-act="tm-reopen">Reabrir intentos</button>`:""}</p>`}
    ${drawn?`<form class="fgrid" data-form="tswap"><select id="ts-a" name="a" aria-label="Persona 1">${personOpts("","Intercambiar a…",CASA)}</select><select id="ts-b" name="b" aria-label="Persona 2">${personOpts("","…con",CASA)}</select><button class="btn ghost sm">Intercambiar</button></form>`:""}
  </section>`:"";
  return `<div class="head"><span class="eyebrow">Brigadas de cocina · por sorteo</span><h2>Equipos</h2><p>Cada noche un equipo se encarga de todo: decidir qué se come, comprar, cocinar, lavar y dejar ordenado. Del sábado 24 al viernes 30, rotando.</p></div>
  ${panel}
  ${!drawn?`<section class="sheet official"><span class="eyebrow">Estado</span><h3>Sorteo pendiente</h3><p class="muted">${n} equipos previstos: ${esc(names.join(", "))}. La organización avisa cuando se sortea.</p></section>`
  :`<section class="sheet"><div class="row between"><span class="small muted">Intento ${draws} de ${MAX_DRAWS} · sorteado ${ago(cfg.drawnAt)} por ${esc(cfg.drawnBy||"la organización")}</span><button class="btn ghost sm" data-act="replay" data-id="teams">▶ Revivir el sorteo</button></div></section>
  <div class="rooms" id="teams">${names.map((nm,i)=>{const ps=CASA.filter(p=>cfg.assign[p]===i);const mine=ME&&ps.includes(ME.name);
    return `<section class="room ${mine?"mine":""}"><span class="eyebrow">Equipo ${i+1}${mine?" · tu equipo":""}</span><h3>${esc(nm)}</h3>
      <p class="small"><b>Cocina:</b> ${esc(nightsOf(i).map(d=>d[1]).join(", "))}</p>
      <div class="names">${ps.map(p=>`<span class="name ${ME&&p===ME.name?"me":""}">${esc(emojiOf(p))} ${esc(p)}</span>`).join("")}</div></section>`}).join("")}</div>
  <section class="sheet"><span class="eyebrow">Rotación de noches</span>${NIGHTS.map((d,k)=>`<div class="row between small"><span>${d[1]}</span><b>${esc(names[k%n])}</b></div>`).join("")}</section>`}`;
},

plata(){

    <div class="sheetframe"><iframe src="${SHEET_URL}/preview" title="Planilla Plata y vuelos" loading="lazy"></iframe></div></section>`;
},

lugares(){

async function playReveal(which){

function resize(file,max){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):ko(new Error("No se pudo procesar")),"image/jpeg",ONLINE?.85:.6);URL.revokeObjectURL(img.src)};img.onerror=()=>ko(new Error("Formato no soportado"));img.src=URL.createObjectURL(file)})}

function needMe(){ if(!ME){ loginModal(); return false;} return true; }
document.addEventListener("click", async ev=>{
  const tabBtn=ev.target.closest("[data-tab]");
  if(tabBtn){ TAB=tabBtn.dataset.tab; MORE_OPEN=false; try{history.replaceState(null,"","#"+TAB)}catch(e){} render(); window.scrollTo({top:0}); return; }
  const pk=ev.target.closest("[data-pick]"); if(pk){ pickName=pk.dataset.pick; pickEmoji=null; pickSure=false; paintLogin(); setTimeout(()=>$("#lg-pin")?.focus(),30); return; }
  const em=ev.target.closest("[data-emoji]"); if(em){ pickEmoji=em.dataset.emoji; document.querySelectorAll("[data-emoji]").forEach(b=>b.setAttribute("aria-pressed",b===em)); return; }
  const a=ev.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==="close-bg"){ if(ev.target===a&&ME) closeModal(); return; }
  try{
  switch(act){
    case "tl": $("#tabs").scrollBy({left:-220,behavior:"smooth"}); break;
    case "rec-start": if(!needMe())return; await recStart(id); break;
    case "rec-stop": recStop(); break;
    case "rec-clear": recClear(); break;
    case "wx-l": { const t=$("#wxtrack"); t.scrollBy({left:-t.clientWidth*.8,behavior:"smooth"}); break; }
    case "wx-r": { const t=$("#wxtrack"); t.scrollBy({left:t.clientWidth*.8,behavior:"smooth"}); break; }
    case "tr": $("#tabs").scrollBy({left:220,behavior:"smooth"}); break;
    case "login": loginModal(); break;
    case "switch": if(ME&&SUPER.includes(ME.name)){ SWITCHING=true; pickName=null; pickSure=false; paintLogin(); } break;
    case "sure-yes": pickSure=true; paintLogin(); break;
    case "sure-no": pickName=null; pickSure=false; paintLogin(); break;
    case "forgot": { if(!pickName) break; const ya=of("pin_reset").some(r=>r.author===pickName&&!r.data.done); if(!ya) await Store.add("pin_reset",{name:pickName},pickName);
      $("#lg-err").textContent="Listo: los admins (Ballve, Donovan o Fermín) te lo blanquean. Después volvé a entrar, elegí tu nombre e inventá un PIN nuevo."; break; }
    case "notif": await pushRefresh(); notifModal(); break;
    case "push-on": if(!needMe())return; a.disabled=true; if(await pushEnable()){ toast("Avisos activados"); notifModal(); } else a.disabled=false; break;
    case "push-off": await pushDisable(); toast("Avisos desactivados"); notifModal(); break;
    case "push-test": a.disabled=true; await pushTest(); a.disabled=false; break;
    case "clike": { if(!needMe())return; const yo=likes(id).find(l=>l.author===ME.name); if(yo) await Store.remove(yo.id); else await Store.add("like",{ref:id}); render(); break; }
    case "edit": EDIT=id; render(); setTimeout(()=>{const t=$("#ed-"+id); if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}},30); break;
    case "edit-cancel": EDIT=null; render(); break;
    case "close": closeModal(); break;
    case "refresh": render(); break;
    case "login-ok": {
      const err=$("#lg-err"); const pin=($("#lg-pin")?.value||"").trim(); if(ME&&!SWITCHING) pickName=ME.name;
      if(!/^\d{4}$/.test(pin)){ err.textContent="El PIN tiene que ser de 4 números."; return; }
      a.disabled=true;
      if(PERFILES[pickName]){
        const r=await Auth.login(pickName,pin,pickEmoji);
        if(r==="bad"){ err.textContent="PIN incorrecto."; a.disabled=false; return; }
        if(r==="emoji"){ err.textContent="Ese escudo lo acaba de agarrar otro. Elegí otro."; await Auth.list(); a.disabled=false; return; }
        if(r!=="ok"){ err.textContent="No se pudo entrar ("+r+")."; a.disabled=false; return; }
      } else {
        if(pin!==($("#lg-pin2")?.value||"").trim()){ err.textContent="Los dos PIN no coinciden."; a.disabled=false; return; }

function rankBlock(mode){

  if(!ms.length) return `<section class="stack"><h3>Ranking de a ${mode}</h3><p class="empty">Sin partidos de a ${mode} todavía.</p></section>`;
  const tbl=(rows,label)=>`<div class="tscroll"><table><thead><tr><th>#</th><th>${label}</th><th class="num">PJ</th><th class="num">PG</th><th class="num">PP</th><th class="num">% Vic</th><th class="num">Pts</th><th class="num">Dif</th><th class="num">Racha</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${ME&&r.k.split(" & ").includes(ME.name)?"me":""}"><td class="num">${i+1}</td><td>${esc(r.k)}</td><td class="num">${r.pj}</td><td class="num">${r.pg}</td><td class="num">${r.pp}</td><td class="num">${pct(r.pg,r.pj)}%</td><td class="num">${r.pf}</td><td class="num">${r.pf-r.pc>0?"+":""}${r.pf-r.pc}</td><td class="num">${r.cur?r.cur+"G":"–"}</td></tr>`).join("")}</tbody></table></div>`;
  const diff=m=>Math.abs(m.data.s1-m.data.s2); const desc=m=>{const d=m.data;const w=d.s1>d.s2;return `${teamName(w?d.p1:d.p2)} ${Math.max(d.s1,d.s2)}–${Math.min(d.s1,d.s2)} a ${teamName(w?d.p2:d.p1)}`};
  const by=(arr,f)=>arr.slice().sort((a,b)=>f(b)-f(a))[0];
  const paliza=ms.slice().sort((a,b)=>diff(b)-diff(a))[0], parejo=ms.slice().sort((a,b)=>diff(a)-diff(b))[0];
  const goleador=by(ind,r=>r.pf), vicio=by(ind,r=>r.pj), racha=by(ind,r=>r.best), castigado=by(ind,r=>r.pp), efic=ind.filter(r=>r.pj>=3).sort((a,b)=>b.pg/b.pj-a.pg/a.pj)[0], repetida=by(par,r=>r.pj);
  const f=(l,v,s)=>`<div class="fact"><span class="lbl">${l}</span><b>${esc(v)}</b><span class="small muted">${esc(s)}</span></div>`;
  return `<section class="stack"><h3>Ranking de a ${mode}</h3>
    <span class="eyebrow">${team==="Pareja"?"Parejas":"Equipos"}</span>${tbl(par,team)}
    <span class="eyebrow">Individual</span>${tbl(ind,"Jugador")}
    <div class="facts">
      ${f("Máxima paliza",desc(paliza),"Diferencia de "+diff(paliza)+" puntos")}
      ${ms.length>1?f("El más parejo",desc(parejo),"Se definió por "+diff(parejo)):""}
      ${f("Más puntos a favor",goleador.k,goleador.pf+" puntos en "+goleador.pj+" partidos")}
      ${f("Mejor racha",racha.k,racha.best+" ganados seguidos")}
      ${efic?f("Más efectivo (3+ PJ)",efic.k,pct(efic.pg,efic.pj)+"% de victorias"):""}

      ${castigado.pp?f("El más castigado",castigado.k,castigado.pp+" derrotas"):""}
      ${f(team==="Pareja"?"Pareja más repetida":"Equipo más repetido",repetida.k,repetida.pj+" partidos juntos")}

}

        if(tResult(t.id,f.dataset.mid,true)) break; const before=champOf(t);
        const dd={mode:t.mode,p1:t.teams[a],p2:t.teams[b],s1,s2,tid:t.id,mid:f.dataset.mid}; dd.ok=autoOk(dd); await Store.add("truco",dd); if(!dd.ok) toast("Cargado. Cuenta cuando lo confirme alguien que perdió.");
        const after=champOf(torneos().find(x=>x.id===t.id)); if(!before&&after){ notify("🏆 Campeón del torneo "+t.name,teamName(after)); toast("¡Tenemos campeón!"); } break; }
      case "vuelo": { const fx={iv:d.iv||null,is:d.is||null,il:d.il||null,vv:d.vv||null,vs:d.vs||null,vl:d.vl||null}; await Store.add("vuelo",{person:ME.name,f:fx}); toast("Vuelo actualizado"); break; }
      case "pago": if(!isIn("economica",ME.name)) break; await Store.add("pago",{person:d.person,concept:d.concept,amount:+d.amount}); toast("Pago registrado"); break;
      case "place": await Store.add("place",{name:d.name.trim(),note:d.note.trim()}); break;
      case "sorpresa": await Store.add("sorpresa",{text:d.text.trim(),day:d.day}); toast("Enviado a la Comisión"); break;
      case "room": { if(!C("cuartos")) break; const cfg=roomsCfg(); await saveRooms({rooms:[...cfg.rooms,{id:"r"+uid(),name:d.name.trim(),cap:Math.max(1,+d.cap)}]}); break; }
      case "teams": { if(!C("equipos")) break; const cfg=teamsCfg(); const count=cfg.drawnAt?cfg.count:Math.max(2,Math.min(7,+(d.count||cfg.count))); const names=[...Array(count)].map((_,k)=>(d["name"+k]||"").trim()||cfg.names[k]||TEAM_NAMES[k]||"Equipo "+(k+1)); await saveTeams({count,names}); toast("Equipos guardados"); break; }
      case "tswap": { if(!C("equipos")) break; if(!d.a||!d.b||d.a===d.b){ toast("Elegí dos personas distintas"); break; } const cfg=teamsCfg(); const as={...cfg.assign}; [as[d.a],as[d.b]]=[as[d.b],as[d.a]]; await saveTeams({assign:as}); toast("Intercambiados"); break; }
      case "pinreset": { if(!SUPER.includes(ME.name)||!d.name) break; const r=await Auth.reset(ME.name,(d.pin||"").trim(),d.name);
        if(r==="bad"){ toast("Tu PIN de admin no es correcto"); if(btn) btn.disabled=false; return; } if(r!=="ok"){ toast("No se pudo blanquear ("+r+")"); break; }
        for(const q of of("pin_reset").filter(x=>x.author===d.name&&!x.data.done)) await Store.update(q.id,{done:true,by:ME.name});
        await Auth.list(); toast("PIN de "+d.name+" blanqueado"); break; }
      case "com-add": { if(!SUPER.includes(ME.name)||!d.person) break; const k=f.dataset.key; const cfg=comCfg(); await saveCom({[k]:[...(cfg[k]||[]),d.person]}); break; }
      case "swap": { if(!C("cuartos")) break; if(!d.a||!d.b||d.a===d.b){ toast("Elegí dos personas distintas"); break; } const cfg=roomsCfg(); const as={...cfg.assign}; const t=as[d.a]; if(as[d.b]) as[d.a]=as[d.b]; else delete as[d.a]; if(t) as[d.b]=t; else delete as[d.b]; await saveRooms({assign:as}); toast("Intercambiados"); break; }
      case "photo": {
        const files=[...f.querySelector("input[type=file]").files]; const st=$("#ph-status"); let ok=0, skip=0;
        for(const file of files){
          st.textContent=`Subiendo ${ok+skip+1} de ${files.length}…`;
          const isV=file.type.startsWith("video/");
          if(isV){ const lim=CONFIG.CLOUDINARY_CLOUD?100:50; if(!ONLINE||file.size>lim*1024*1024){ skip++; continue; } const ext=(file.name.split(".").pop()||"mp4").toLowerCase(); const m=await Store.media(file,"video",ext,file.type); await Store.add("photo",{url:m.url,thumb:m.thumb||null,dl:m.dl||null,caption:d.caption.trim(),type:"video"}); }
          else { const blob=await resize(file,ONLINE?1920:700);
            if(ONLINE&&CONFIG.CLOUDINARY_CLOUD){ const m=await Store.media(blob,"foto","jpg","image/jpeg"); await Store.add("photo",{url:m.url,thumb:m.thumb,dl:m.dl,caption:d.caption.trim(),type:"image"}); }
            else { const url=await Store.upload(blob,"jpg","image/jpeg"); let thumb=null; if(ONLINE){ try{ thumb=await Store.upload(await resize(file,480),"jpg","image/jpeg"); }catch(e){} }
              await Store.add("photo",{url,thumb,caption:d.caption.trim(),type:"image"}); } }
          ok++;
        }
        if(skip) toast(`${skip} video${skip>1?"s":""} no se subieron (más de 50 MB${ONLINE?"":" o modo demo"}).`);
        if(ok) notify("📸 "+ME.name+" subió "+ok+(ok===1?" archivo":" archivos"),d.caption||"Entrá a verlos"); break; }
    }
    render();
  }catch(e){ console.error(e); toast("No se pudo guardar. Revisá la conexión."); if(btn) btn.disabled=false; }
});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1); if(TABS.some(x=>x[0]===t)&&t!==TAB){TAB=t;render();}});

/* ================= Arranque ================= */
(async()=>{
  $("#tabs").addEventListener("scroll",updateArrows,{passive:true}); window.addEventListener("resize",updateArrows);
  render();
  lsSet("pibex_seen", Date.now());
  try{ await Store.init(); }catch(e){ console.error(e); toast("No se pudo conectar con la base de datos"); }
  if(ME && (!PEOPLE.includes(ME.name) || (!PERFILES[ME.name] && !AUTH_ERR))){ ME=null; lsSet("pibex_me2",null); }
  render();
  pushRefresh();
  if(!ME && !AUTH_ERR) loginModal();
})();

</script>
